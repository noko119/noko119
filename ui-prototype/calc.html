<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皮带机 PIDM · 逐步透明计算（GC-01）</title>
  <link rel="stylesheet" href="calc.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">PIDM</div>
        <div>
          <h1>逐步透明计算</h1>
          <p>DTⅡ(A) · 算法 DTII-P2P-v0.2 · 对齐黄金算例 GC-01</p>
        </div>
      </div>
      <div class="meta">
        <a class="chip link" href="path-editor.html">← 路径编辑器</a>
        <a class="chip link" href="index.html">五面板</a>
        <span class="chip" id="algoChip">DTII-P2P-v0.2</span>
        <span class="chip" id="sourceChip">几何：—</span>
        <span class="chip" id="passChip">对照：—</span>
      </div>
    </header>

    <div class="toolbar">
      <button class="btn primary" id="btnRun">运行 GC-01</button>
      <button class="btn" id="btnRunPath">运行路径提取包</button>
      <button class="btn" id="btnExpandAll">全部展开</button>
      <button class="btn" id="btnCollapseAll">全部折叠</button>
      <label class="split">
        双驱配比
        <select id="splitSelect" title="第一:第二传动滚筒功率比">
          <option value="1:1" selected>1:1</option>
          <option value="2:1">2:1</option>
          <option value="1:2">1:2</option>
        </select>
      </label>
    </div>

    <div class="coeff-panel card" id="coeffPanel">
      <h3>系数 / 工况 <span class="muted" id="coeffFreezeChip">未冻结</span></h3>
      <div class="coeff-grid">
        <label>f<input type="number" step="0.001" id="c_f" /></label>
        <label>C<input type="number" step="0.01" id="c_C" /></label>
        <label>η<input type="number" step="0.01" id="c_eta" /></label>
        <label>μ<input type="number" step="0.01" id="c_mu" /></label>
        <label>v (m/s)<input type="number" step="0.1" id="c_v" /></label>
        <label>qRO<input type="number" step="0.1" id="c_qRO" /></label>
        <label>qRU<input type="number" step="0.1" id="c_qRU" /></label>
        <label>qB<input type="number" step="0.1" id="c_qB" /></label>
        <label>qG<input type="number" step="0.1" id="c_qG" /></label>
        <label>FS1 (N)<input type="number" step="1" id="c_FS1" /></label>
        <label>FS2 (N)<input type="number" step="1" id="c_FS2" /></label>
        <label>工况 f
          <select id="c_duty">
            <option value="empty">空载</option>
            <option value="full" selected>满载</option>
            <option value="heavy">重载偏保守</option>
          </select>
        </label>
      </div>
      <div class="coeff-actions">
        <button class="btn" id="btnApplyDuty" type="button">应用工况 f</button>
        <button class="btn primary" id="btnFreezeCoeff" type="button">冻结系数</button>
        <button class="btn" id="btnLoadFreeze" type="button">载入冻结</button>
      </div>
    </div>

    <div class="layout">
      <aside class="card">
        <h3 id="inputTitle">GC-01 输入（采用值）</h3>
        <div id="inputPanel" class="kv"></div>
        <h3>摘要结果</h3>
        <div id="summaryPanel" class="kv"></div>
        <h3>与期望对照</h3>
        <div id="comparePanel"></div>
      </aside>
      <main class="card steps-card">
        <h3>计算步骤（点击展开：输入 → 公式 → 中间值 → 结果）</h3>
        <div id="stepsPanel"></div>
      </main>
    </div>
  </div>
  <script type="module" src="calc-app.js"></script>
</body>
</html>
