  <title>螺纹型号 → 端头结构表</title>

  <style>
:root {
  --ink: #1a2420;
  --muted: #5c6b64;
  --paper: #eef3ef;
  --panel: rgba(255, 255, 255, 0.78);
  --line: rgba(26, 36, 32, 0.12);
  --accent: #c45c26;
  --accent-2: #1f6f5b;
  --steel: #2f4a56;
  --shadow: 0 18px 40px rgba(31, 52, 44, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", "Outfit", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  font-family: var(--font-body);
  background: var(--paper);
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(900px 500px at 8% -5%, rgba(196, 92, 38, 0.16), transparent 55%),
    radial-gradient(700px 420px at 92% 8%, rgba(31, 111, 91, 0.14), transparent 50%),
    linear-gradient(165deg, #f5f7f4 0%, #e7eee9 42%, #dfe8e3 100%);
  overflow: hidden;
}

.atmosphere::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(47, 74, 86, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47, 74, 86, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 40% 20%, black 20%, transparent 75%);
  animation: gridDrift 18s linear infinite;
}

@keyframes gridDrift {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-28px, -28px, 0); }
}

.shell {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0 64px;
}

.hero {
  margin-bottom: 28px;
  animation: rise 0.7s ease both;
}

.brand {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.18em;
  font-size: 13px;
  color: var(--accent);
}

.hero h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--steel);
}

.lede {
  margin: 12px 0 0;
  max-width: 36rem;
  color: var(--muted);
  font-size: 1.02rem;
  line-height: 1.55;
}

.panel {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  animation: rise 0.75s ease 0.08s both;
}

.field-row {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 12px;
}

.field-row.simple {
  grid-template-columns: 1.8fr 1fr 1fr;
}

.field-row.free {
  grid-template-columns: 1fr 1fr 1fr 1.4fr;
}

.hint {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field.grow { grid-column: span 1; }

.field span {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}

.field input,
.field select {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 12px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus,
.field select:focus {
  border-color: rgba(196, 92, 38, 0.55);
  box-shadow: 0 0 0 3px rgba(196, 92, 38, 0.15);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.chip {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--steel);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
}

.chip:hover {
  transform: translateY(-1px);
  border-color: rgba(31, 111, 91, 0.35);
  background: #f3faf7;
}

.chip.active {
  background: var(--accent-2);
  border-color: var(--accent-2);
  color: #fff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

.btn {
  height: 42px;
  border-radius: 12px;
  border: 1px solid transparent;
  padding: 0 16px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
}

.btn:hover { transform: translateY(-1px); }

.btn.primary {
  background: linear-gradient(135deg, #c45c26, #a84718);
  color: #fff;
  box-shadow: 0 10px 22px rgba(196, 92, 38, 0.28);
}

.btn.ghost {
  background: #fff;
  border-color: var(--line);
  color: var(--steel);
}

.status {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.status.error { color: #b42318; }
.status.ok { color: var(--accent-2); }

.result-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 18px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  animation: rise 0.65s ease both;
}

.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.2s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.3s; }

.designation-card {
  grid-column: 1 / -1;
}

.span-2 { grid-column: 1 / -1; }

.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: -0.02em;
  color: var(--steel);
}

.card h3 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--steel);
}

.muted { color: var(--muted); margin: 6px 0 0; font-size: 14px; }

.diagram {
  width: 100%;
  height: auto;
  margin-top: 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, #f8fbf9, #e8f0eb);
  border: 1px solid var(--line);
}

.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.data caption {
  caption-side: top;
  text-align: left;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--steel);
}

.data th,
.data td {
  padding: 9px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: baseline;
}

.data th {
  color: var(--muted);
  font-weight: 500;
  width: 58%;
}

.data td {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--ink);
}

.data tr:last-child th,
.data tr:last-child td { border-bottom: 0; }

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.formula {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.footnote {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 860px) {
  .field-row,
  .field-row.simple,
  .field-row.free {
    grid-template-columns: 1fr 1fr;
  }
  .field.grow { grid-column: 1 / -1; }
  .result-grid { grid-template-columns: 1fr; }
  .designation-card,
  .span-2 { grid-column: auto; }
  .split { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .shell { width: min(100% - 20px, 1120px); padding-top: 24px; }
  .field-row,
  .field-row.simple,
  .field-row.free { grid-template-columns: 1fr; }
  .actions { align-items: stretch; }
  .btn { width: 100%; }
}

    .const-bar span {
      font-size: 12px; padding: 6px 10px; border-radius: 999px;

    .status.error { color: #b42318; }

    }
  
</style>

<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">THREAD END CARD · <a href="./pipe-end.html" style="color:inherit">接管计算</a> · <a href="./index.html" style="color:inherit">通用螺纹</a></p>
      <h1>螺纹型号 → 端头结构</h1>
      <p class="lede">手动输入螺纹型号（如 M200×2），直接生成公扣端头与母扣内腔结构表（计入 210）。</p>
    </header>

    <section class="panel">
      <div class="const-bar">
        <span>止口 10mm</span>
        <span>P=2 · 6圈 · 旋合 12mm</span>
        <span>退刀槽按 GB/T 3（P=2）</span>
        <span>计入总长 210mm</span>
      </div>

      <div class="field-row" style="grid-template-columns:1.6fr 1fr auto">
        <label class="field grow">
          <span>螺纹型号</span>
          <input id="specInput" type="text" value="M200×2" placeholder="例如 M200×2、M200X2、200" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span>退刀槽长度档</span>
          <select id="grooveKind">
            <option value="normal" selected>普通 g1</option>
            <option value="short">短 g2</option>
            <option value="long">长 g3</option>
          </select>
        </label>
        <div class="actions" style="margin:0;align-self:end">
          <button type="button" class="btn primary" id="calcBtn">生成结构表</button>
          <button type="button" class="btn ghost" id="copyBtn">复制</button>
        </div>
      </div>
      <p class="hint" style="margin-top:10px">只需螺纹型号；牙顶/牙底/退刀槽底径随型号自动计算。</p>
      <p class="status" id="status" role="status"></p>
    </section>

    <div id="cards" class="card-pair" hidden>
      <article class="card">
        <h3 id="maleTitle">公扣端头结构（计入 210）</h3>
        <p class="sub" id="maleSub"></p>
        <table class="data"><tbody id="maleTable"></tbody></table>
      </article>
      <article class="card">
        <h3 id="femaleTitle">母扣端头内腔（计入 210）</h3>
        <p class="sub" id="femaleSub"></p>
        <table class="data"><tbody id="femaleTable"></tbody></table>
      </article>
    </div>
  </main>
  <script>
/**
 * 接管端头螺纹完整计算逻辑
 * - P=2 固定；60° 三角螺纹；牙型按 GB/T 196
 * - 螺纹中心线落在小管管壁中心；同时校验大管壁不击穿
 * - 螺纹大径就近取整数（不强制尾数 0/5）
 */

/** @typedef {{ D1: number, t1: number, D2: number, t2: number }} PipeEndInput */

const PIPE_END_CONST = {
  locatorLen: 10, // 定位止口 mm
  pitch: 2, // 螺距 P mm
  turns: 6, // 旋合圈数
  engageLen: 12, // 6×P
  bodyTotalLen: 210, // 接管本体总长 mm
  tipAngle: 60,
  // GB/T 196 / 常用牙型系数（相对螺距）
  H_factor: 0.866, // 原始牙高 H = 0.8660×P
  h_factor: 0.5413, // 工作牙高 h
  R_factor: 0.144, // 牙底最大圆角 R
};

/** GB/T 3 退刀槽（P=2 常用） */
const UNDERCUT_P2 = {
  external: { g1: 4.0, g2: 3.0, g3: 6.0, k: 3.0, r: 0.8 },
  internal: { g1: 4.0, g2: 3.0, g3: 6.0, m: 3.0, r: 0.8 },
};

function round3(n) {
  return Math.round(n * 1000) / 1000;
}

function nearInt(n) {
  return Math.round(n);
}

/** 解析手动规格：M161×2 / M161X2 / 161 */
function parseManualMajor(raw, defaultPitch = PIPE_END_CONST.pitch) {
  const s = String(raw || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/[×✕✖ｘＸxX＊*－—–−-]/g, "x");
  if (!s) return { ok: false, error: "请输入手动规格，如 M161×2 或 161" };
  let m = s.match(/^M(\d+(?:\.\d+)?)(?:x(\d+(?:\.\d+)?))?$/i);
  if (m) {
    const major = Math.round(Number(m[1]));
    const pitch = m[2] != null ? Number(m[2]) : defaultPitch;
    if (!(major > 0)) return { ok: false, error: "螺纹大径无效" };
    if (Math.abs(pitch - defaultPitch) > 1e-9) {
      return { ok: false, error: `本工具螺距固定为 P=${defaultPitch}，请写 M${major}×${defaultPitch}` };
    }
    return { ok: true, majorDia: major, pitch: defaultPitch };
  }
  if (/^\d+(?:\.\d+)?$/.test(s)) {
    const major = Math.round(Number(s));
    if (!(major > 0)) return { ok: false, error: "螺纹大径无效" };
    return { ok: true, majorDia: major, pitch: defaultPitch };
  }
  return { ok: false, error: "无法识别。支持：M161×2、M161X2、161" };
}

/**
 * @param {PipeEndInput} input
 * @param {{ grooveKind?: 'normal'|'short'|'long', majorDia?: number, designation?: string }} [opt]
 */
function computePipeEndThread(input, opt = {}) {
  const { D1, t1, D2, t2 } = input;
  const errors = [];
  const warnings = [];

  if (!(D1 > 0) || !(t1 > 0) || !(D2 > 0) || !(t2 > 0)) {
    return { ok: false, error: "请完整填写 D₁、t₁、D₂、t₂（均须大于 0）" };
  }
  if (t1 * 2 >= D1) {
    return { ok: false, error: "小管壁厚无效：2×t₁ 不得大于等于 D₁" };
  }
  if (t2 * 2 >= D2) {
    return { ok: false, error: "大管壁厚无效：2×t₂ 不得大于等于 D₂" };
  }
  if (D1 >= D2) {
    warnings.push("通常公头小管外径 D₁ 应小于母头大管外径 D₂，请确认录入是否正确");
  }

  const P = PIPE_END_CONST.pitch;
  const H = round3(PIPE_END_CONST.H_factor * P);
  const h = round3(PIPE_END_CONST.h_factor * P);
  const R = round3(PIPE_END_CONST.R_factor * P);

  // 1. 小管管壁中心直径
  const smallCenterDia = round3(D1 - t1);

  // 3–4. 理论外螺纹大径 / 内螺纹小径
  const theoryMajor = round3(smallCenterDia + h);
  const theoryMinor = round3(smallCenterDia - h);

  // 5. 大管内孔
  const largeBore = round3(D2 - 2 * t2);

  // 推荐大径（就近取整）
  const recommendedMajor = nearInt(theoryMajor);
  const recommendedDesignation = `M${recommendedMajor}×${P}`;

  // 最终采用：手动覆盖 > 推荐
  let majorDia = recommendedMajor;
  let isManual = false;
  if (opt.majorDia != null && Number.isFinite(Number(opt.majorDia))) {
    majorDia = Math.round(Number(opt.majorDia));
    isManual = majorDia !== recommendedMajor;
  } else if (opt.designation) {
    const parsed = parseManualMajor(opt.designation, P);
    if (!parsed.ok) return parsed;
    majorDia = parsed.majorDia;
    isManual = majorDia !== recommendedMajor;
  }
  if (!(majorDia > 0)) {
    return { ok: false, error: "螺纹大径无效" };
  }

  const designation = `M${majorDia}×${P}`;

  // 选定规格后：母扣内螺纹小径按工作牙高对称匹配（大径 − 2h）
  const internalMinor = round3(majorDia - 2 * h);
  // 牙顶：外螺纹=大径；内螺纹=小径
  const externalCrest = majorDia;
  const internalCrest = internalMinor;
  const externalRoot = internalMinor; // 与工作牙高对称匹配的牙底参考
  const internalRoot = majorDia; // 内螺纹牙底=大径
  // GB/T 196 基本小径（对照）
  const gbD1 = round3(majorDia - 1.082531755 * P);
  const gbD2 = round3(majorDia - 0.649519053 * P);
  const gbD3 = round3(majorDia - 1.226869322 * P);

  // 校验：内螺纹小径须大于大管内孔，保证加工在实体内、不打穿
  const pierceOk = internalMinor > largeBore;
  // 螺纹不超出大管外径实体
  const withinLargeOd = majorDia < D2;
  // 螺纹大致落在大管壁厚实体带内（大径小于外径，啮合区高于内孔）
  const withinLargeWall = majorDia <= D2 && internalMinor >= largeBore;
  // 相对小管：大径不超过小管外径，小径不低于小管内孔
  const smallBore = round3(D1 - 2 * t1);
  const withinSmall = majorDia <= D1 && internalMinor >= smallBore;

  let checkPass = true;
  let checkMessage = "满足：内螺纹位于大管实体内，未击穿管壁";

  if (!pierceOk) {
    checkPass = false;
    checkMessage = "当前参数无法加工，管壁厚度不足";
    warnings.push(checkMessage);
  } else if (!withinLargeOd) {
    checkPass = false;
    checkMessage = "当前参数无法加工，管壁厚度不足（螺纹大径超出大管外径）";
    warnings.push(checkMessage);
  } else if (!withinSmall) {
    warnings.push("提示：螺纹相对小管壁中心偏移后，可能接近或超出小管壁实体边界，请复核");
  }

  if (isManual) {
    warnings.push(`当前为手动规格 ${designation}（系统推荐 ${recommendedDesignation}）`);
  }

  const grooveKind = opt.grooveKind || "normal";
  const widthKey = grooveKind === "short" ? "g2" : grooveKind === "long" ? "g3" : "g1";
  const extGrooveW = UNDERCUT_P2.external[widthKey];
  const intGrooveW = UNDERCUT_P2.internal[widthKey];
  const extGrooveDf = round3(majorDia - UNDERCUT_P2.external.k);
  const intGrooveDg = round3(majorDia + UNDERCUT_P2.internal.m);

  const maleEndLen = round3(
    PIPE_END_CONST.locatorLen + PIPE_END_CONST.engageLen + extGrooveW
  );
  const femaleEndLen = round3(
    PIPE_END_CONST.locatorLen + PIPE_END_CONST.engageLen + intGrooveW
  );

  const fitInBody =
    maleEndLen <= PIPE_END_CONST.bodyTotalLen &&
    femaleEndLen <= PIPE_END_CONST.bodyTotalLen;
  if (!fitInBody) {
    warnings.push("端头结构长度超过接管总长 210mm，请检查退刀槽长度档");
  }

  const jointLabel = `${trim(D1)}×${trim(t1)} → ${trim(D2)}×${trim(t2)}`;
  const jointKind =
    D2 > D1 ? (D2 / D1 <= 1.25 ? "相邻规格对接" : "跨规格对接") : "对接组合";

  // 邻近可选规格（推荐 ±2）
  const nearby = [-2, -1, 0, 1, 2].map((d) => {
    const maj = recommendedMajor + d;
    return {
      majorDia: maj,
      designation: `M${maj}×${P}`,
      isRecommended: d === 0,
    };
  });

  return {
    ok: true,
    checkPass,
    checkMessage,
    warnings,
    errors,
    constants: { ...PIPE_END_CONST, H, h, R },
    input: { D1, t1, D2, t2 },
    jointCombo: jointLabel,
    jointKind,
    D1,
    D2,
    t1,
    t2,
    P,
    H,
    h,
    R,
    smallCenterDia,
    theoryMajor,
    theoryMinor,
    largeBore,
    smallBore,
    recommendedMajor,
    recommendedDesignation,
    isManual,
    majorDia,
    designation,
    // 牙顶 / 牙底（内外都给出）
    crest: {
      external: externalCrest, // 外螺纹牙顶 = 大径
      internal: internalCrest, // 内螺纹牙顶 = 小径
    },
    root: {
      external: externalRoot,
      internal: internalRoot,
    },
    nearby,
    femaleInternal: {
      designation,
      minor: internalMinor,
      crest: internalCrest,
      pitchDia: gbD2,
      major: majorDia,
      root: internalRoot,
      note: "母扣内螺纹配套公扣所选规格；内螺纹牙顶=小径，牙底=大径",
    },
    gbBasic: { d: majorDia, d2: gbD2, d1: gbD1, d3: gbD3, D1: gbD1, D2: gbD2, D: majorDia },
    wallCheck: {
      pierceOk,
      withinLargeOd,
      withinLargeWall,
      withinSmall,
      pass: checkPass,
      message: checkMessage,
    },
    maleEnd: {
      locator: PIPE_END_CONST.locatorLen,
      thread: PIPE_END_CONST.engageLen,
      undercutWidth: extGrooveW,
      undercutDf: extGrooveDf,
      undercutR: UNDERCUT_P2.external.r,
      total: maleEndLen,
    },
    femaleEnd: {
      locator: PIPE_END_CONST.locatorLen,
      thread: PIPE_END_CONST.engageLen,
      undercutWidth: intGrooveW,
      undercutDg: intGrooveDg,
      undercutR: UNDERCUT_P2.internal.r,
      total: femaleEndLen,
    },
    bodyTotalLen: PIPE_END_CONST.bodyTotalLen,
    fitInBody,
    assemblyNote:
      "装配时公头定位止口先插入母扣止口导向，再旋入实现 12mm 完全啮合；退刀槽供车削退刀。工况：静止装配、无载荷、仅定位锁紧。",
  };
}

function trim(n) {
  const s = String(Number(Number(n).toFixed(3)));
  if (!s.includes(".")) return s;
  return s.replace(/\.?0+$/, "");
}

/** 扁平输出表（便于复制） */
function pipeEndToRows(r) {
  if (!r.ok) return [["错误", r.error]];
  return [
    ["对接组合", r.jointCombo],
    ["对接类型", r.jointKind],
    ["小管外径 D₁", `${r.D1} mm`],
    ["大管外径 D₂", `${r.D2} mm`],
    ["小管壁厚 t₁", `${r.t1} mm`],
    ["大管壁厚 t₂", `${r.t2} mm`],
    ["螺距 P", `${r.P} mm`],
    ["基础牙高 H", `${r.H} mm`],
    ["工作牙高 h", `${r.h} mm`],
    ["牙底圆角 R", `${r.R} mm`],
    ["小管壁中心径", `${r.smallCenterDia} mm`],
    ["理论外螺纹大径", `${r.theoryMajor} mm`],
    ["理论内螺纹小径", `${r.theoryMinor} mm`],
    ["系统推荐规格", r.recommendedDesignation],
    ["采用规格来源", r.isManual ? "手动给定" : "系统推荐"],
    ["螺纹大径（最终）", `${r.majorDia} mm`],
    ["螺纹规格标记", r.designation],
    ["外螺纹牙顶（大径）", `${r.crest.external} mm`],
    ["外螺纹牙底（小径）", `${r.root.external} mm`],
    ["内螺纹牙顶（小径）", `${r.crest.internal} mm`],
    ["内螺纹牙底（大径）", `${r.root.internal} mm`],
    ["母扣内螺纹", `${r.femaleInternal.designation}（牙顶 ${r.crest.internal} mm）`],
    ["校验结果", r.checkPass ? `通过：${r.checkMessage}` : `警告：${r.checkMessage}`],
    ["公扣端头总长（止口+螺纹+退刀槽）", `${r.maleEnd.total} mm`],
    ["母扣端头内腔总长（止口+内螺纹+内退刀槽）", `${r.femaleEnd.total} mm`],
    ["外螺纹退刀槽宽度", `${r.maleEnd.undercutWidth} mm`],

    ["接管本体总长", `${r.bodyTotalLen} mm`],
  ];
}

/**
 * 仅按螺纹型号生成公/母扣端头结构表（不需要管径壁厚）
 * @param {string} designationRaw 如 M200×2 / M200X2 / 200
 * @param {{ grooveKind?: 'normal'|'short'|'long' }} [opt]
 */
function computeThreadEndCards(designationRaw, opt = {}) {
  const parsed = parseManualMajor(designationRaw);
  if (!parsed.ok) return parsed;

  const P = PIPE_END_CONST.pitch;
  const h = round3(PIPE_END_CONST.h_factor * P);
  const H = round3(PIPE_END_CONST.H_factor * P);
  const R = round3(PIPE_END_CONST.R_factor * P);
  const majorDia = parsed.majorDia;
  const designation = `M${majorDia}×${P}`;

  const externalCrest = majorDia;
  const internalCrest = round3(majorDia - 2 * h);
  const externalRoot = internalCrest;
  const internalRoot = majorDia;

  const grooveKind = opt.grooveKind || "normal";
  const widthKey = grooveKind === "short" ? "g2" : grooveKind === "long" ? "g3" : "g1";
  const extGrooveW = UNDERCUT_P2.external[widthKey];
  const intGrooveW = UNDERCUT_P2.internal[widthKey];
  const undercutDf = round3(majorDia - UNDERCUT_P2.external.k);
  const undercutDg = round3(majorDia + UNDERCUT_P2.internal.m);

  const locator = PIPE_END_CONST.locatorLen;
  const engage = PIPE_END_CONST.engageLen;
  const maleTotal = round3(locator + engage + extGrooveW);
  const femaleTotal = round3(locator + engage + intGrooveW);

  return {
    ok: true,
    designation,
    majorDia,
    P,
    H,
    h,
    R,
    bodyTotalLen: PIPE_END_CONST.bodyTotalLen,
    grooveKind,
    crest: { external: externalCrest, internal: internalCrest },
    root: { external: externalRoot, internal: internalRoot },
    male: {
      title: `公扣端头结构（计入 ${PIPE_END_CONST.bodyTotalLen}）`,
      rows: [
        ["定位止口", `${locator} mm`],
        ["螺纹有效旋合段", `${engage} mm`],
        ["外螺纹牙顶（大径）", `${externalCrest} mm`],
        ["外螺纹牙底（小径）", `${externalRoot} mm`],
        ["外螺纹退刀槽宽", `${extGrooveW} mm`],
        ["退刀槽底径 df", `${undercutDf} mm`],
        ["端头合计", `${maleTotal} mm`],
      ],
      locator,
      engage,
      undercutWidth: extGrooveW,
      undercutDf,
      total: maleTotal,
    },
    female: {
      title: `母扣端头内腔（计入 ${PIPE_END_CONST.bodyTotalLen}）`,
      rows: [
        ["定位止口接收段", `${locator} mm`],
        ["内螺纹旋合段", `${engage} mm`],
        ["内螺纹牙顶（小径）", `${internalCrest} mm`],
        ["内螺纹牙底（大径）", `${internalRoot} mm`],
        ["内螺纹退刀槽宽", `${intGrooveW} mm`],
        ["退刀槽底径 Dg", `${undercutDg} mm`],
        ["内腔合计", `${femaleTotal} mm`],
      ],
      locator,
      engage,
      undercutWidth: intGrooveW,
      undercutDg,
      total: femaleTotal,
    },
  };
}



const $ = (id) => document.getElementById(id);
let last = null;

function fill(tbody, rows) {
  tbody.innerHTML = rows
    .map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`)
    .join("");
}

function run() {
  const r = computeThreadEndCards($("specInput").value, {
    grooveKind: $("grooveKind").value,
  });

  if (!r.ok) {
    $("cards").hidden = true;
    $("status").textContent = r.error;
    $("status").className = "status error";
    last = null;
    return;
  }

  last = r;
  $("cards").hidden = false;
  $("specInput").value = r.designation;
  $("maleTitle").textContent = r.male.title;
  $("femaleTitle").textContent = r.female.title;
  $("maleSub").textContent = "";
  $("femaleSub").textContent = "";
  fill($("maleTable"), r.male.rows);
  fill($("femaleTable"), r.female.rows);
  $("status").textContent = `已生成 ${r.designation} 公/母扣端头结构`;
  $("status").className = "status ok";
}

async function copy() {
  if (!last) {
    $("status").textContent = "请先生成";
    $("status").className = "status error";
    return;
  }
  const nl = String.fromCharCode(10);
  const tab = String.fromCharCode(9);
  const lines = [
    last.male.title,
    ...last.male.rows.map(([k, v]) => `${k}${tab}${v}`),
    "",
    last.female.title,
    ...last.female.rows.map(([k, v]) => `${k}${tab}${v}`),
  ];
  const text = lines.join(nl);
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  $("status").textContent = "已复制";
  $("status").className = "status ok";
}

$("calcBtn").addEventListener("click", run);
$("copyBtn").addEventListener("click", copy);
$("grooveKind").addEventListener("change", run);
$("specInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    run();
  }
});
$("specInput").addEventListener("change", run);

run();

</script>
