<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>锥管模具分段设计</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./thread-calc.css" />
  <style>
    .const-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .const-bar span {
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: #fff; border: 1px solid var(--line); color: var(--steel);
    }
    .field-row.five { grid-template-columns: repeat(5, 1fr); }
    .stack { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
    .joint-block { margin-top: 8px; }
    .joint-block h4 {
      margin: 0 0 10px; font-family: var(--font-display); color: var(--steel); font-size: 1rem;
    }
    .card-pair {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .warn-box {
      margin-top: 12px; padding: 12px 14px; border-radius: 12px;
      background: #fff4f0; border: 1px solid #f0b090; color: #8a2e0e;
      font-weight: 700; display: none;
    }
    .warn-box.show { display: block; }
    .schema {
      display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 8px;
    }
    .schema .seg {
      flex: 1 1 120px; min-width: 110px; background: #fff;
      border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .schema .seg strong {
      display: block; font-family: var(--font-display); font-size: 1.25rem; color: var(--steel);
    }
    .schema .seg span { color: var(--muted); font-size: 12px; }
    .schema .arrow {
      align-self: center; color: var(--accent); font-weight: 800; font-family: var(--font-display);
    }
    .diagram-wrap { margin-top: 12px; }
    .diagram-wrap .diagram {
      display: block; width: 100%; height: auto; margin-top: 8px;
      background: linear-gradient(180deg, #f8fbf9, #e8f0eb);
      border: 1px solid var(--line); border-radius: 14px;
    }
    @media (max-width: 860px) {
      .field-row.five { grid-template-columns: 1fr 1fr; }
      .card-pair { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">CONE MOLD · <a href="./thread-card.html" style="color:inherit">端头表</a> · <a href="./pipe-end.html" style="color:inherit">接管计算</a> · <a href="./index.html" style="color:inherit">通用螺纹</a></p>
      <h1>锥管模具分段</h1>
      <p class="lede">按总装结构：<strong>绿色连续内锥</strong> + <strong>外套分段套装</strong>。默认案例 730 / ø194→ø108；参数可改。</p>
    </header>

    <section class="panel">
      <div class="const-bar">
        <span>内锥连续贯穿</span>
        <span>外套分段（大节 210）</span>
        <span>接头 12+1+10+1</span>
        <span>案例：730 = 45+680+5</span>
      </div>

      <div class="field-row five">
        <label class="field">
          <span>锥上口 ø / mm</span>
          <input id="bigOd" type="number" min="1" step="any" value="194" />
        </label>
        <label class="field">
          <span>锥下口 ø / mm</span>
          <input id="smallOd" type="number" min="1" step="any" value="108" />
        </label>
        <label class="field">
          <span>装配总高 / mm</span>
          <input id="moldHeight" type="number" min="1" step="any" value="730" />
        </label>
        <label class="field">
          <span>上口余量</span>
          <input id="topAllowance" type="number" min="0" step="any" value="45" />
        </label>
        <label class="field">
          <span>下口余量</span>
          <input id="bottomAllowance" type="number" min="0" step="any" value="5" />
        </label>
      </div>

      <div class="field-row" style="margin-top:12px;grid-template-columns:1fr 1fr 1fr 1fr auto">
        <label class="field">
          <span>外套标准节长</span>
          <input id="standardLen" type="number" min="50" step="any" value="210" />
        </label>
        <label class="field">
          <span>外套名义壁厚</span>
          <input id="wall" type="number" min="1" step="any" value="20" />
        </label>
        <label class="field">
          <span>强制外套节数</span>
          <input id="segmentCount" type="number" min="2" step="1" placeholder="自动" />
        </label>
        <label class="field">
          <span>外圆序列（可选）</span>
          <input id="midOds" type="text" placeholder="如 245,219,194" autocomplete="off" />
        </label>
        <div class="actions" style="margin:0;align-self:end">
          <button type="button" class="btn primary" id="calcBtn">生成方案</button>
          <button type="button" class="btn ghost" id="copyBtn">复制</button>
        </div>
      </div>
      <p class="hint" style="margin-top:10px">锥段高 = 总高 − 上余量 − 下余量。外套套在锥上；节间螺纹按 12+1+10+1，规格圆整到 0/5。</p>
      <p class="status" id="status" role="status"></p>
      <div class="warn-box" id="warnBox"></div>
    </section>

    <div id="results" class="stack">
      <article class="card">
        <h3>组装后示意图</h3>
        <p class="muted" id="summaryLine">生成方案后显示总高 / 面距摘要</p>
        <div class="diagram-wrap" id="assyDiagram"><!--DEFAULT_ASSY_SVG--></div>
      </article>

      <article class="card">
        <h3>分段一览</h3>
        <div class="schema" id="schema"></div>
      </article>

      <article class="card">
        <h3>各节明细</h3>
        <table class="data">
          <thead>
            <tr><th>外套</th><th>贴锥径</th><th>外圆</th><th>长度</th><th>类型</th><th>壁厚</th><th>端头</th><th>余量</th></tr>
          </thead>
          <tbody id="segTable"></tbody>
        </table>
      </article>

      <article class="card">
        <h3>螺纹接头</h3>
        <table class="data">
          <thead>
            <tr><th>道</th><th>上套→下套</th><th>接头处锥径</th><th>轴向细节</th><th>螺纹</th><th>牙顶外/内</th><th>外套局部壁厚</th></tr>
          </thead>
          <tbody id="jointTable"></tbody>
        </table>
      </article>

      <div id="jointCards" class="stack"></div>
    </div>
  </main>
  <script type="module" src="./cone-mold-app.js"></script>
</body>
</html>
