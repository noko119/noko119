<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>锥管模具分段设计</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #1a2420;
  --muted: #5c6b64;
  --paper: #eef3ef;
  --panel: rgba(255, 255, 255, 0.78);
  --line: rgba(26, 36, 32, 0.12);
  --accent: #c45c26;
  --accent-2: #1f6f5b;
  --steel: #2f4a56;
  --shadow: 0 18px 40px rgba(31, 52, 44, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", "Outfit", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  font-family: var(--font-body);
  background: var(--paper);
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(900px 500px at 8% -5%, rgba(196, 92, 38, 0.16), transparent 55%),
    radial-gradient(700px 420px at 92% 8%, rgba(31, 111, 91, 0.14), transparent 50%),
    linear-gradient(165deg, #f5f7f4 0%, #e7eee9 42%, #dfe8e3 100%);
  overflow: hidden;
}

.atmosphere::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(47, 74, 86, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47, 74, 86, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 40% 20%, black 20%, transparent 75%);
  animation: gridDrift 18s linear infinite;
}

@keyframes gridDrift {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-28px, -28px, 0); }
}

.shell {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0 64px;
}

.hero {
  margin-bottom: 28px;
  animation: rise 0.7s ease both;
}

.brand {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.18em;
  font-size: 13px;
  color: var(--accent);
}

.hero h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--steel);
}

.lede {
  margin: 12px 0 0;
  max-width: 36rem;
  color: var(--muted);
  font-size: 1.02rem;
  line-height: 1.55;
}

.panel {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  animation: rise 0.75s ease 0.08s both;
}

.field-row {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 12px;
}

.field-row.simple {
  grid-template-columns: 1.8fr 1fr 1fr;
}

.field-row.free {
  grid-template-columns: 1fr 1fr 1fr 1.4fr;
}

.hint {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field.grow { grid-column: span 1; }

.field span {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}

.field input,
.field select {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 12px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus,
.field select:focus {
  border-color: rgba(196, 92, 38, 0.55);
  box-shadow: 0 0 0 3px rgba(196, 92, 38, 0.15);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.chip {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--steel);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
}

.chip:hover {
  transform: translateY(-1px);
  border-color: rgba(31, 111, 91, 0.35);
  background: #f3faf7;
}

.chip.active {
  background: var(--accent-2);
  border-color: var(--accent-2);
  color: #fff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

.btn {
  height: 42px;
  border-radius: 12px;
  border: 1px solid transparent;
  padding: 0 16px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
}

.btn:hover { transform: translateY(-1px); }

.btn.primary {
  background: linear-gradient(135deg, #c45c26, #a84718);
  color: #fff;
  box-shadow: 0 10px 22px rgba(196, 92, 38, 0.28);
}

.btn.ghost {
  background: #fff;
  border-color: var(--line);
  color: var(--steel);
}

.status {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.status.error { color: #b42318; }
.status.ok { color: var(--accent-2); }

.result-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 18px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  animation: rise 0.65s ease both;
}

.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.2s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.3s; }

.designation-card {
  grid-column: 1 / -1;
}

.span-2 { grid-column: 1 / -1; }

.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: -0.02em;
  color: var(--steel);
}

.card h3 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--steel);
}

.muted { color: var(--muted); margin: 6px 0 0; font-size: 14px; }

.diagram {
  width: 100%;
  height: auto;
  margin-top: 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, #f8fbf9, #e8f0eb);
  border: 1px solid var(--line);
}

.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.data caption {
  caption-side: top;
  text-align: left;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--steel);
}

.data th,
.data td {
  padding: 9px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: baseline;
}

.data th {
  color: var(--muted);
  font-weight: 500;
  width: 58%;
}

.data td {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--ink);
}

.data tr:last-child th,
.data tr:last-child td { border-bottom: 0; }

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.formula {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.footnote {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 860px) {
  .field-row,
  .field-row.simple,
  .field-row.free {
    grid-template-columns: 1fr 1fr;
  }
  .field.grow { grid-column: 1 / -1; }
  .result-grid { grid-template-columns: 1fr; }
  .designation-card,
  .span-2 { grid-column: auto; }
  .split { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .shell { width: min(100% - 20px, 1120px); padding-top: 24px; }
  .field-row,
  .field-row.simple,
  .field-row.free { grid-template-columns: 1fr; }
  .actions { align-items: stretch; }
  .btn { width: 100%; }
}


    .const-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .const-bar span {
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: #fff; border: 1px solid var(--line); color: var(--steel);
    }
    .field-row.five { grid-template-columns: repeat(5, 1fr); }
    .stack { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
    .joint-block { margin-top: 8px; }
    .joint-block h4 {
      margin: 0 0 10px; font-family: var(--font-display); color: var(--steel); font-size: 1rem;
    }
    .card-pair {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .warn-box {
      margin-top: 12px; padding: 12px 14px; border-radius: 12px;
      background: #fff4f0; border: 1px solid #f0b090; color: #8a2e0e;
      font-weight: 700; display: none;
    }
    .warn-box.show { display: block; }
    .schema {
      display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 8px;
    }
    .schema .seg {
      flex: 1 1 120px; min-width: 110px; background: #fff;
      border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
      box-shadow: var(--shadow);
    }
    .schema .seg strong {
      display: block; font-family: var(--font-display); font-size: 1.25rem; color: var(--steel);
    }
    .schema .seg span { color: var(--muted); font-size: 12px; }
    .schema .arrow {
      align-self: center; color: var(--accent); font-weight: 800; font-family: var(--font-display);
    }
    .diagram-wrap { margin-top: 12px; }
    .diagram-wrap .diagram {
      display: block; width: 100%; height: auto; margin-top: 8px;
      background: linear-gradient(180deg, #f8fbf9, #e8f0eb);
      border: 1px solid var(--line); border-radius: 14px;
    }
    @media (max-width: 860px) {
      .field-row.five { grid-template-columns: 1fr 1fr; }
      .card-pair { grid-template-columns: 1fr; }
    }
  
</style>

    <header class="hero">
      <p class="brand">CONE MOLD · <a href="./thread-card.html" style="color:inherit">端头表</a> · <a href="./pipe-end.html" style="color:inherit">接管计算</a> · <a href="./index.html" style="color:inherit">通用螺纹</a></p>
      <h1>锥管模具分段</h1>
      <p class="lede">按总装结构：<strong>绿色连续内锥</strong> + <strong>外套分段套装</strong>。默认案例 730 / ø194→ø108；参数可改。</p>
    </header>

    <section class="panel">
      <div class="const-bar">
        <span>内锥连续贯穿</span>
        <span>外套分段（大节 210）</span>
        <span>接头 12+1+10+1</span>
        <span>案例：730 = 45+680+5</span>
      </div>

      <div class="field-row five">
        <label class="field">
          <span>锥上口 ø / mm</span>
          <input id="bigOd" type="number" min="1" step="any" value="194" />
        </label>
        <label class="field">
          <span>锥下口 ø / mm</span>
          <input id="smallOd" type="number" min="1" step="any" value="108" />
        </label>
        <label class="field">
          <span>装配总高 / mm</span>
          <input id="moldHeight" type="number" min="1" step="any" value="730" />
        </label>
        <label class="field">
          <span>上口余量</span>
          <input id="topAllowance" type="number" min="0" step="any" value="45" />
        </label>
        <label class="field">
          <span>下口余量</span>
          <input id="bottomAllowance" type="number" min="0" step="any" value="5" />
        </label>
      </div>

      <div class="field-row" style="margin-top:12px;grid-template-columns:1fr 1fr 1fr 1fr auto">
        <label class="field">
          <span>外套标准节长</span>
          <input id="standardLen" type="number" min="50" step="any" value="210" />
        </label>
        <label class="field">
          <span>外套名义壁厚</span>
          <input id="wall" type="number" min="1" step="any" value="20" />
        </label>
        <label class="field">
          <span>强制外套节数</span>
          <input id="segmentCount" type="number" min="2" step="1" placeholder="自动" />
        </label>
        <label class="field">
          <span>外圆序列（可选）</span>
          <input id="midOds" type="text" placeholder="如 245,219,194" autocomplete="off" />
        </label>
        <div class="actions" style="margin:0;align-self:end">
          <button type="button" class="btn primary" id="calcBtn">生成方案</button>
          <button type="button" class="btn ghost" id="copyBtn">复制</button>
        </div>
      </div>
      <p class="hint" style="margin-top:10px">锥段高 = 总高 − 上余量 − 下余量。外套套在锥上；节间螺纹按 12+1+10+1，规格圆整到 0/5。</p>
      <p class="status" id="status" role="status"></p>
      <div class="warn-box" id="warnBox"></div>
    </section>

  <script>
/**
 * 接管端头螺纹完整计算逻辑
 * - P=2 固定；60° 三角螺纹；牙型按 GB/T 196
 * - 螺纹中心线落在小管管壁中心；同时校验大管壁不击穿
 * - 螺纹大径就近取整数（不强制尾数 0/5）
 */

/** @typedef {{ D1: number, t1: number, D2: number, t2: number }} PipeEndInput */

const PIPE_END_CONST = {
  locatorLen: 10, // 定位止口 mm
  pitch: 2, // 螺距 P mm
  turns: 6, // 旋合圈数
  engageLen: 12, // 6×P
  bodyTotalLen: 210, // 接管本体总长 mm
  tipAngle: 60,
  // GB/T 196 / 常用牙型系数（相对螺距）
  H_factor: 0.866, // 原始牙高 H = 0.8660×P
  h_factor: 0.5413, // 工作牙高 h
  R_factor: 0.144, // 牙底最大圆角 R
};

/** GB/T 3 退刀槽（P=2 常用） */
const UNDERCUT_P2 = {
  external: { g1: 4.0, g2: 3.0, g3: 6.0, k: 3.0, r: 0.8 },
  internal: { g1: 4.0, g2: 3.0, g3: 6.0, m: 3.0, r: 0.8 },
};

function round3(n) {
  return Math.round(n * 1000) / 1000;
}

function nearInt(n) {
  return Math.round(n);
}

/** 解析手动规格：M161×2 / M161X2 / 161 */
function parseManualMajor(raw, defaultPitch = PIPE_END_CONST.pitch) {
  const s = String(raw || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/[×✕✖ｘＸxX＊*－—–−-]/g, "x");
  if (!s) return { ok: false, error: "请输入手动规格，如 M161×2 或 161" };
  let m = s.match(/^M(\d+(?:\.\d+)?)(?:x(\d+(?:\.\d+)?))?$/i);
  if (m) {
    const major = Math.round(Number(m[1]));
    const pitch = m[2] != null ? Number(m[2]) : defaultPitch;
    if (!(major > 0)) return { ok: false, error: "螺纹大径无效" };
    if (Math.abs(pitch - defaultPitch) > 1e-9) {
      return { ok: false, error: `本工具螺距固定为 P=${defaultPitch}，请写 M${major}×${defaultPitch}` };
    }
    return { ok: true, majorDia: major, pitch: defaultPitch };
  }
  if (/^\d+(?:\.\d+)?$/.test(s)) {
    const major = Math.round(Number(s));
    if (!(major > 0)) return { ok: false, error: "螺纹大径无效" };
    return { ok: true, majorDia: major, pitch: defaultPitch };
  }
  return { ok: false, error: "无法识别。支持：M161×2、M161X2、161" };
}

/**
 * @param {PipeEndInput} input
 * @param {{ grooveKind?: 'normal'|'short'|'long', majorDia?: number, designation?: string }} [opt]
 */
function computePipeEndThread(input, opt = {}) {
  const { D1, t1, D2, t2 } = input;
  const errors = [];
  const warnings = [];

  if (!(D1 > 0) || !(t1 > 0) || !(D2 > 0) || !(t2 > 0)) {
    return { ok: false, error: "请完整填写 D₁、t₁、D₂、t₂（均须大于 0）" };
  }
  if (t1 * 2 >= D1) {
    return { ok: false, error: "小管壁厚无效：2×t₁ 不得大于等于 D₁" };
  }
  if (t2 * 2 >= D2) {
    return { ok: false, error: "大管壁厚无效：2×t₂ 不得大于等于 D₂" };
  }
  if (D1 >= D2) {
    warnings.push("通常公头小管外径 D₁ 应小于母头大管外径 D₂，请确认录入是否正确");
  }

  const P = PIPE_END_CONST.pitch;
  const H = round3(PIPE_END_CONST.H_factor * P);
  const h = round3(PIPE_END_CONST.h_factor * P);
  const R = round3(PIPE_END_CONST.R_factor * P);

  // 1. 小管管壁中心直径
  const smallCenterDia = round3(D1 - t1);

  // 3–4. 理论外螺纹大径 / 内螺纹小径
  const theoryMajor = round3(smallCenterDia + h);
  const theoryMinor = round3(smallCenterDia - h);

  // 5. 大管内孔
  const largeBore = round3(D2 - 2 * t2);

  // 推荐大径（就近取整）
  const recommendedMajor = nearInt(theoryMajor);
  const recommendedDesignation = `M${recommendedMajor}×${P}`;

  // 最终采用：手动覆盖 > 推荐
  let majorDia = recommendedMajor;
  let isManual = false;
  if (opt.majorDia != null && Number.isFinite(Number(opt.majorDia))) {
    majorDia = Math.round(Number(opt.majorDia));
    isManual = majorDia !== recommendedMajor;
  } else if (opt.designation) {
    const parsed = parseManualMajor(opt.designation, P);
    if (!parsed.ok) return parsed;
    majorDia = parsed.majorDia;
    isManual = majorDia !== recommendedMajor;
  }
  if (!(majorDia > 0)) {
    return { ok: false, error: "螺纹大径无效" };
  }

  const designation = `M${majorDia}×${P}`;

  // 选定规格后：母扣内螺纹小径按工作牙高对称匹配（大径 − 2h）
  const internalMinor = round3(majorDia - 2 * h);
  // 牙顶：外螺纹=大径；内螺纹=小径
  const externalCrest = majorDia;
  const internalCrest = internalMinor;
  const externalRoot = internalMinor; // 与工作牙高对称匹配的牙底参考
  const internalRoot = majorDia; // 内螺纹牙底=大径
  // GB/T 196 基本小径（对照）
  const gbD1 = round3(majorDia - 1.082531755 * P);
  const gbD2 = round3(majorDia - 0.649519053 * P);
  const gbD3 = round3(majorDia - 1.226869322 * P);

  // 校验：内螺纹小径须大于大管内孔，保证加工在实体内、不打穿
  const pierceOk = internalMinor > largeBore;
  // 螺纹不超出大管外径实体
  const withinLargeOd = majorDia < D2;
  // 螺纹大致落在大管壁厚实体带内（大径小于外径，啮合区高于内孔）
  const withinLargeWall = majorDia <= D2 && internalMinor >= largeBore;
  // 相对小管：大径不超过小管外径，小径不低于小管内孔
  const smallBore = round3(D1 - 2 * t1);
  const withinSmall = majorDia <= D1 && internalMinor >= smallBore;

  let checkPass = true;
  let checkMessage = "满足：内螺纹位于大管实体内，未击穿管壁";

  if (!pierceOk) {
    checkPass = false;
    checkMessage = "当前参数无法加工，管壁厚度不足";
    warnings.push(checkMessage);
  } else if (!withinLargeOd) {
    checkPass = false;
    checkMessage = "当前参数无法加工，管壁厚度不足（螺纹大径超出大管外径）";
    warnings.push(checkMessage);
  } else if (!withinSmall) {
    warnings.push("提示：螺纹相对小管壁中心偏移后，可能接近或超出小管壁实体边界，请复核");
  }

  if (isManual) {
    warnings.push(`当前为手动规格 ${designation}（系统推荐 ${recommendedDesignation}）`);
  }

  const grooveKind = opt.grooveKind || "normal";
  const widthKey = grooveKind === "short" ? "g2" : grooveKind === "long" ? "g3" : "g1";
  const extGrooveW = UNDERCUT_P2.external[widthKey];
  const intGrooveW = UNDERCUT_P2.internal[widthKey];
  const extGrooveDf = round3(majorDia - UNDERCUT_P2.external.k);
  const intGrooveDg = round3(majorDia + UNDERCUT_P2.internal.m);

  const maleEndLen = round3(
    PIPE_END_CONST.locatorLen + PIPE_END_CONST.engageLen + extGrooveW
  );
  const femaleEndLen = round3(
    PIPE_END_CONST.locatorLen + PIPE_END_CONST.engageLen + intGrooveW
  );

  const fitInBody =
    maleEndLen <= PIPE_END_CONST.bodyTotalLen &&
    femaleEndLen <= PIPE_END_CONST.bodyTotalLen;
  if (!fitInBody) {
    warnings.push("端头结构长度超过接管总长 210mm，请检查退刀槽长度档");
  }

  const jointLabel = `${trim(D1)}×${trim(t1)} → ${trim(D2)}×${trim(t2)}`;
  const jointKind =
    D2 > D1 ? (D2 / D1 <= 1.25 ? "相邻规格对接" : "跨规格对接") : "对接组合";

  // 邻近可选规格（推荐 ±2）
  const nearby = [-2, -1, 0, 1, 2].map((d) => {
    const maj = recommendedMajor + d;
    return {
      majorDia: maj,
      designation: `M${maj}×${P}`,
      isRecommended: d === 0,
    };
  });

  return {
    ok: true,
    checkPass,
    checkMessage,
    warnings,
    errors,
    constants: { ...PIPE_END_CONST, H, h, R },
    input: { D1, t1, D2, t2 },
    jointCombo: jointLabel,
    jointKind,
    D1,
    D2,
    t1,
    t2,
    P,
    H,
    h,
    R,
    smallCenterDia,
    theoryMajor,
    theoryMinor,
    largeBore,
    smallBore,
    recommendedMajor,
    recommendedDesignation,
    isManual,
    majorDia,
    designation,
    // 牙顶 / 牙底（内外都给出）
    crest: {
      external: externalCrest, // 外螺纹牙顶 = 大径
      internal: internalCrest, // 内螺纹牙顶 = 小径
    },
    root: {
      external: externalRoot,
      internal: internalRoot,
    },
    nearby,
    femaleInternal: {
      designation,
      minor: internalMinor,
      crest: internalCrest,
      pitchDia: gbD2,
      major: majorDia,
      root: internalRoot,
      note: "母扣内螺纹配套公扣所选规格；内螺纹牙顶=小径，牙底=大径",
    },
    gbBasic: { d: majorDia, d2: gbD2, d1: gbD1, d3: gbD3, D1: gbD1, D2: gbD2, D: majorDia },
    wallCheck: {
      pierceOk,
      withinLargeOd,
      withinLargeWall,
      withinSmall,
      pass: checkPass,
      message: checkMessage,
    },
    maleEnd: {
      locator: PIPE_END_CONST.locatorLen,
      thread: PIPE_END_CONST.engageLen,
      undercutWidth: extGrooveW,
      undercutDf: extGrooveDf,
      undercutR: UNDERCUT_P2.external.r,
      total: maleEndLen,
    },
    femaleEnd: {
      locator: PIPE_END_CONST.locatorLen,
      thread: PIPE_END_CONST.engageLen,
      undercutWidth: intGrooveW,
      undercutDg: intGrooveDg,
      undercutR: UNDERCUT_P2.internal.r,
      total: femaleEndLen,
    },
    bodyTotalLen: PIPE_END_CONST.bodyTotalLen,
    fitInBody,
    assemblyNote:
      "装配时公头定位止口先插入母扣止口导向，再旋入实现 12mm 完全啮合；退刀槽供车削退刀。工况：静止装配、无载荷、仅定位锁紧。",
  };
}

function trim(n) {
  const s = String(Number(Number(n).toFixed(3)));
  if (!s.includes(".")) return s;
  return s.replace(/\.?0+$/, "");
}

/** 扁平输出表（便于复制） */
function pipeEndToRows(r) {
  if (!r.ok) return [["错误", r.error]];
  return [
    ["对接组合", r.jointCombo],
    ["对接类型", r.jointKind],
    ["小管外径 D₁", `${r.D1} mm`],
    ["大管外径 D₂", `${r.D2} mm`],
    ["小管壁厚 t₁", `${r.t1} mm`],
    ["大管壁厚 t₂", `${r.t2} mm`],
    ["螺距 P", `${r.P} mm`],
    ["基础牙高 H", `${r.H} mm`],
    ["工作牙高 h", `${r.h} mm`],
    ["牙底圆角 R", `${r.R} mm`],
    ["小管壁中心径", `${r.smallCenterDia} mm`],
    ["理论外螺纹大径", `${r.theoryMajor} mm`],
    ["理论内螺纹小径", `${r.theoryMinor} mm`],
    ["系统推荐规格", r.recommendedDesignation],
    ["采用规格来源", r.isManual ? "手动给定" : "系统推荐"],
    ["螺纹大径（最终）", `${r.majorDia} mm`],
    ["螺纹规格标记", r.designation],
    ["外螺纹牙顶（大径）", `${r.crest.external} mm`],
    ["外螺纹牙底（小径）", `${r.root.external} mm`],
    ["内螺纹牙顶（小径）", `${r.crest.internal} mm`],
    ["内螺纹牙底（大径）", `${r.root.internal} mm`],
    ["母扣内螺纹", `${r.femaleInternal.designation}（牙顶 ${r.crest.internal} mm）`],
    ["校验结果", r.checkPass ? `通过：${r.checkMessage}` : `警告：${r.checkMessage}`],
    ["公扣端头总长（止口+螺纹+退刀槽）", `${r.maleEnd.total} mm`],
    ["母扣端头内腔总长（止口+内螺纹+内退刀槽）", `${r.femaleEnd.total} mm`],
    ["外螺纹退刀槽宽度", `${r.maleEnd.undercutWidth} mm`],
    ["内螺纹退刀槽宽度", `${r.femaleEnd.undercutWidth} mm`],
    ["接管本体总长", `${r.bodyTotalLen} mm`],
  ];
}

/**
 * 仅按螺纹型号生成公/母扣端头结构表（不需要管径壁厚）
 * @param {string} designationRaw 如 M200×2 / M200X2 / 200
 * @param {{ grooveKind?: 'normal'|'short'|'long' }} [opt]
 */
function computeThreadEndCards(designationRaw, opt = {}) {
  const parsed = parseManualMajor(designationRaw);
  if (!parsed.ok) return parsed;

  const P = PIPE_END_CONST.pitch;
  const h = round3(PIPE_END_CONST.h_factor * P);
  const H = round3(PIPE_END_CONST.H_factor * P);
  const R = round3(PIPE_END_CONST.R_factor * P);
  const majorDia = parsed.majorDia;
  const designation = `M${majorDia}×${P}`;

  const externalCrest = majorDia;
  const internalCrest = round3(majorDia - 2 * h);
  const externalRoot = internalCrest;
  const internalRoot = majorDia;

  const grooveKind = opt.grooveKind || "normal";
  const widthKey = grooveKind === "short" ? "g2" : grooveKind === "long" ? "g3" : "g1";
  const extGrooveW = UNDERCUT_P2.external[widthKey];
  const intGrooveW = UNDERCUT_P2.internal[widthKey];
  const undercutDf = round3(majorDia - UNDERCUT_P2.external.k);
  const undercutDg = round3(majorDia + UNDERCUT_P2.internal.m);

  const locator = PIPE_END_CONST.locatorLen;
  const engage = PIPE_END_CONST.engageLen;
  const maleTotal = round3(locator + engage + extGrooveW);
  const femaleTotal = round3(locator + engage + intGrooveW);

  return {
    ok: true,
    designation,
    majorDia,
    P,
    H,
    h,
    R,
    bodyTotalLen: PIPE_END_CONST.bodyTotalLen,
    grooveKind,
    crest: { external: externalCrest, internal: internalCrest },
    root: { external: externalRoot, internal: internalRoot },
    male: {
      title: `公扣端头结构（计入 ${PIPE_END_CONST.bodyTotalLen}）`,
      rows: [
        ["定位止口", `${locator} mm`],
        ["螺纹有效旋合段", `${engage} mm`],
        ["外螺纹牙顶（大径）", `${externalCrest} mm`],
        ["外螺纹牙底（小径）", `${externalRoot} mm`],
        ["外螺纹退刀槽宽", `${extGrooveW} mm`],
        ["退刀槽底径 df", `${undercutDf} mm`],
        ["端头合计", `${maleTotal} mm`],
      ],
      locator,
      engage,
      undercutWidth: extGrooveW,
      undercutDf,
      total: maleTotal,
    },
    female: {
      title: `母扣端头内腔（计入 ${PIPE_END_CONST.bodyTotalLen}）`,
      rows: [
        ["定位止口接收段", `${locator} mm`],
        ["内螺纹旋合段", `${engage} mm`],
        ["内螺纹牙顶（小径）", `${internalCrest} mm`],
        ["内螺纹牙底（大径）", `${internalRoot} mm`],
        ["内螺纹退刀槽宽", `${intGrooveW} mm`],
        ["退刀槽底径 Dg", `${undercutDg} mm`],
        ["内腔合计", `${femaleTotal} mm`],
      ],
      locator,
      engage,
      undercutWidth: intGrooveW,
      undercutDg,
      total: femaleTotal,
    },
  };
}



/**
 * 锥管模具设计（正确模型）
 *
 * - 内件：连续外锥（绿）——上口/下口为锥面口径
 * - 外套：分段套筒套在锥上（红/青/紫…），节间止口嵌套
 * - 案例默认：总高 730，锥段 680，上 45，下 5，ø194→ø108，节长 210
 * - 接头细节默认：12（旋合）+ 1（间隙）+ 10（止口）+ 1（间隙）
 */

const STD_PIPE_ODS = [
  89, 102, 108, 114, 121, 127, 133, 140, 152, 159, 168, 180, 194, 203, 219, 245, 273, 299, 325, 351, 377,
];

/** 接头轴向细节（自上而下） */
const JOINT_STACK_DEFAULT = [
  { key: "engage", name: "旋合", h: 12 },
  { key: "gapA", name: "间隙", h: 1 },
  { key: "locator", name: "止口", h: 10 },
  { key: "gapB", name: "间隙", h: 1 },
];

const CONE_MOLD_DEFAULTS = {
  coneTopDia: 194,
  coneBottomDia: 108,
  totalHeight: 730,
  topAllowance: 45,
  bottomAllowance: 5,
  standardLen: 210,
  wall: 20,
  pitch: 2,
};

function round3(n) {
  return Math.round(n * 1000) / 1000;
}

function roundMajor05(n) {
  return Math.round(Number(n) / 5) * 5;
}

function nearestOdAtLeast(target, catalog = STD_PIPE_ODS) {
  const hit = catalog.find((d) => d >= target);
  if (hit != null) return hit;
  return catalog[catalog.length - 1];
}

/** 锥面直径：z 从装配顶向下；锥段在 [topAllowance, totalHeight-bottomAllowance] */
function coneDiaAt(z, input) {
  const topA = Number(input.topAllowance);
  const botA = Number(input.bottomAllowance);
  const H = Number(input.totalHeight);
  const d0 = Number(input.coneTopDia);
  const d1 = Number(input.coneBottomDia);
  const zCone0 = topA;
  const zCone1 = H - botA;
  const L = zCone1 - zCone0;
  if (L <= 0) return d0;
  if (z <= zCone0) return d0;
  if (z >= zCone1) return d1;
  return round3(d0 + (d1 - d0) * ((z - zCone0) / L));
}

function planSegmentLengths(totalHeight, standardLen = 210, minSmall = 80, maxSmall = 450) {
  const H = Number(totalHeight);
  const S = Number(standardLen);
  if (!(H > 0) || !(S > 0)) return { ok: false, error: "总高与标准节长须大于 0" };
  const candidates = [];
  for (let k = 1; k <= 12; k++) {
    const smallLen = round3(H - k * S);
    if (smallLen <= 0) break;
    const inPrefer = smallLen >= 150 && smallLen <= 310;
    const inAllow = smallLen >= minSmall && smallLen <= maxSmall;
    if (!inAllow) continue;
    candidates.push({
      segmentCount: k + 1,
      largeCount: k,
      standardLen: S,
      smallLen,
      inPrefer,
      score: inPrefer ? Math.abs(smallLen - 210) : 100 + Math.abs(smallLen - 210) + k,
    });
  }
  if (!candidates.length) {
    return { ok: false, error: `总高 ${H} 无法用大节 ${S} + 小节非标凑齐` };
  }
  candidates.sort((a, b) => a.score - b.score || a.segmentCount - b.segmentCount);
  return { ok: true, plan: candidates[0], alternatives: candidates.slice(0, 6) };
}

function minFemaleWall(D1, t1, D2, majorDia) {
  for (let t2 = 4; t2 <= 80; t2 += 0.5) {
    const r = computePipeEndThread({ D1, t1, D2, t2 }, majorDia != null ? { majorDia } : {});
    if (r.ok && r.checkPass) return t2;
  }
  return null;
}

function jointStackHeight(stack = JOINT_STACK_DEFAULT) {
  return round3(stack.reduce((s, x) => s + Number(x.h), 0));
}

/**
 * @param {object} input
 */
function designConeMold(input = {}) {
  const coneTopDia = Number(input.coneTopDia ?? input.cavityTop ?? input.bigOd ?? CONE_MOLD_DEFAULTS.coneTopDia);
  const coneBottomDia = Number(
    input.coneBottomDia ?? input.cavityBottom ?? input.smallOd ?? CONE_MOLD_DEFAULTS.coneBottomDia
  );
  const totalHeight = Number(input.totalHeight ?? input.moldHeight ?? CONE_MOLD_DEFAULTS.totalHeight);
  const topAllowance = Number(input.topAllowance ?? CONE_MOLD_DEFAULTS.topAllowance);
  const bottomAllowance = Number(input.bottomAllowance ?? CONE_MOLD_DEFAULTS.bottomAllowance);
  const standardLen = Number(input.standardLen ?? CONE_MOLD_DEFAULTS.standardLen);
  const wall = Number(input.wall ?? CONE_MOLD_DEFAULTS.wall);
  const roundThread = input.roundThread !== false;
  const jointStack = input.jointStack || JOINT_STACK_DEFAULT;
  const jointH = jointStackHeight(jointStack);

  if (!(coneTopDia > coneBottomDia)) return { ok: false, error: "锥上口须大于锥下口" };
  if (!(totalHeight > topAllowance + bottomAllowance)) {
    return { ok: false, error: "总高须大于上口余量+下口余量" };
  }
  if (!(wall > 0)) return { ok: false, error: "外套名义壁厚须大于 0" };

  const coneHeight = round3(totalHeight - topAllowance - bottomAllowance);

  const lengthPlan = planSegmentLengths(totalHeight, standardLen);
  if (!lengthPlan.ok) return lengthPlan;

  let segmentCount = lengthPlan.plan.segmentCount;
  if (input.segmentCount != null && Number(input.segmentCount) >= 2) {
    const forced = Number(input.segmentCount);
    const smallLen = round3(totalHeight - (forced - 1) * standardLen);
    if (smallLen <= 0) return { ok: false, error: `节数 ${forced} 过大` };
    segmentCount = forced;
    lengthPlan.plan = {
      segmentCount: forced,
      largeCount: forced - 1,
      standardLen,
      smallLen,
      inPrefer: smallLen >= 150 && smallLen <= 310,
      score: 0,
    };
  }

  const lengths = Array.from({ length: segmentCount }, (_, i) =>
    i === segmentCount - 1 ? lengthPlan.plan.smallLen : standardLen
  );

  const base = {
    coneTopDia,
    coneBottomDia,
    totalHeight,
    topAllowance,
    bottomAllowance,
  };

  let z = 0;
  const sleeves = lengths.map((length, i) => {
    const z0 = z;
    const z1 = round3(z + length);
    z = z1;
    const coneAtTop = coneDiaAt(z0, base);
    const coneAtBot = coneDiaAt(z1, base);
    const coneAtMid = coneDiaAt((z0 + z1) / 2, base);
    // 外套内孔贴锥：外圆 ≈ 本节最大锥径 + 2×壁厚
    const needOuter = Math.max(coneAtTop, coneAtBot) + 2 * wall;
    let outerOd = nearestOdAtLeast(needOuter);
    if (input.preferredOuterOds && input.preferredOuterOds[i] != null) {
      outerOd = Number(input.preferredOuterOds[i]);
    }
    const isFirst = i === 0;
    const isLast = i === segmentCount - 1;
    return {
      index: i + 1,
      role: "sleeve",
      length,
      kind: isLast ? "非标" : "标准",
      z0,
      z1,
      coneAtTop,
      coneAtBot,
      coneAtMid,
      outerOd,
      wall,
      // 兼容旧表
      od: outerOd,
      cavityTop: coneAtTop,
      cavityBottom: coneAtBot,
      femaleSleeve: !isLast,
      maleNeck: !isFirst,
      topFaceOffset: isFirst ? topAllowance : null,
      belowTopFace: isFirst ? round3(length - topAllowance) : null,
      bottomFaceOffset: isLast ? bottomAllowance : null,
      aboveBottomFace: isLast ? round3(length - bottomAllowance) : null,
    };
  });

  for (let i = 1; i < sleeves.length; i++) {
    if (sleeves[i].outerOd > sleeves[i - 1].outerOd) {
      sleeves[i].outerOd = sleeves[i - 1].outerOd;
      sleeves[i].od = sleeves[i].outerOd;
    }
  }

  const cone = {
    role: "innerCone",
    topDia: coneTopDia,
    bottomDia: coneBottomDia,
    height: coneHeight,
    z0: topAllowance,
    z1: round3(totalHeight - bottomAllowance),
    totalWithEnds: totalHeight,
  };

  const joints = [];
  for (let i = 0; i < sleeves.length - 1; i++) {
    const upper = sleeves[i];
    const lower = sleeves[i + 1];
    const zJoint = lower.z0;
    const coneD = coneDiaAt(zJoint, base);
    const D1 = lower.outerOd;
    const D2 = upper.outerOd;
    const t1 = round3((D1 - coneD) / 2);
    if (!(t1 > 1)) {
      joints.push({
        ok: false,
        index: i + 1,
        error: `接头${i + 1}壁厚不足（锥径 ${coneD} / 外圆 ${D1}）`,
        z: zJoint,
        coneDia: coneD,
      });
      continue;
    }
    const auto = computePipeEndThread({ D1, t1, D2, t2: 50 });
    if (!auto.ok) {
      joints.push({ ok: false, index: i + 1, error: auto.error, z: zJoint, coneDia: coneD });
      continue;
    }
    let major = roundThread ? roundMajor05(auto.recommendedMajor) : auto.recommendedMajor;
    if (major >= D1) major = roundMajor05(D1 - 5);
    if (major <= coneD) major = roundMajor05(coneD + 5);
    const minT2 = minFemaleWall(D1, t1, D2, major);
    const check = computePipeEndThread({ D1, t1, D2, t2: minT2 || 50 }, { majorDia: major });
    const cards = computeThreadEndCards(`M${major}×${PIPE_END_CONST.pitch}`);

    joints.push({
      ok: true,
      index: i + 1,
      z: zJoint,
      coneDia: coneD,
      cavityAtJoint: coneD,
      fromOd: D2,
      toOd: D1,
      upperOuter: D2,
      lowerOuter: D1,
      maleWall: t1,
      jointStack,
      jointStackHeight: jointH,
      nestStyle: "外套节间嵌套（上套下）· 内锥连续贯穿",
      autoDesignation: auto.recommendedDesignation,
      designation: `M${major}×${PIPE_END_CONST.pitch}`,
      majorDia: major,
      crest: check.crest,
      root: check.root,
      undercutDf: major - 3,
      undercutDg: major + 3,
      endStructure: jointH,
      locator: jointStack.find((x) => x.key === "locator")?.h ?? 10,
      engage: jointStack.find((x) => x.key === "engage")?.h ?? 12,
      gaps: jointStack.filter((x) => x.key.startsWith("gap")).map((x) => x.h),
      minFemaleWall: minT2,
      checkPass: !!minT2,
      checkMessage: minT2
        ? `外套局部壁厚建议 ≥ ${minT2} mm`
        : "外套壁厚无法满足螺纹实体",
      maleCard: cards.ok ? cards.male : null,
      femaleCard: cards.ok ? cards.female : null,
      theoryMajor: auto.theoryMajor,
      smallCenterDia: auto.smallCenterDia,
    });
  }

  const sumLen = round3(sleeves.reduce((s, x) => s + x.length, 0));

  return {
    ok: true,
    model: "inner-cone-outer-sleeves",
    input: {
      coneTopDia,
      coneBottomDia,
      totalHeight,
      topAllowance,
      bottomAllowance,
      standardLen,
      wall,
      roundThread,
      // 兼容旧字段
      bigOd: coneTopDia,
      smallOd: coneBottomDia,
      moldHeight: totalHeight,
      cavityTop: coneTopDia,
      cavityBottom: coneBottomDia,
    },
    cone,
    sleeves,
    segments: sleeves, // 兼容旧 UI
    segmentCount,
    joints,
    summary: {
      moldHeight: sumLen,
      totalHeight: sumLen,
      heightOk: Math.abs(sumLen - totalHeight) < 1e-6,
      coneHeight,
      faceToFace: coneHeight,
      expectedFaceToFace: coneHeight,
      cavityTop: coneTopDia,
      cavityBottom: coneBottomDia,
      coneTopDia,
      coneBottomDia,
      taperPerMm: round3((coneTopDia - coneBottomDia) / coneHeight),
      jointCount: joints.length,
      jointStack,
      jointStackHeight: jointH,
      pitch: PIPE_END_CONST.pitch,
      locator: 10,
      engage: 12,
      undercut: 4,
      nestNote: "内锥连续 + 外套分段套装；接头 12+1+10+1",
    },
    alternatives: lengthPlan.alternatives,
  };
}

function pickSegmentOds() {
  return { ok: false, error: "已改为内锥+外套模型，请用 designConeMold" };
}

function cavityDiaAt(z, top, bottom, H) {
  // 兼容旧签名
  if (typeof top === "object") return coneDiaAt(z, top);
  return coneDiaAt(z, {
    coneTopDia: top,
    coneBottomDia: bottom,
    totalHeight: H,
    topAllowance: 0,
    bottomAllowance: 0,
  });
}


/**
 * 组装示意图：绿色连续内锥 + 彩色外套分段
 * 默认案例尺寸关系：总高730，锥段680，上45，下5，ø194→ø108
 */

function t(n) {
  const s = String(Number(Number(n).toFixed(3)));
  return s.includes(".") ? s.replace(/\.?0+$/, "") : s;
}

function dimV(x, y1, y2, label, color = "#2f4a56") {
  const mid = (y1 + y2) / 2;
  return `
    <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="1"/>
    <line x1="${x - 3}" y1="${y1}" x2="${x + 3}" y2="${y1}" stroke="${color}" stroke-width="1"/>
    <line x1="${x - 3}" y1="${y2}" x2="${x + 3}" y2="${y2}" stroke="${color}" stroke-width="1"/>
    <text x="${x - 6}" y="${mid + 3}" text-anchor="end" fill="${color}" font-size="9" font-weight="600">${label}</text>
  `;
}

const SLEEVE_COLORS = ["#c45c5c", "#6ab0c9", "#8a6bb8", "#c49a6c", "#5cbf8a"];

function renderConeMoldDiagram(r) {
  if (!r?.ok || !r.sleeves?.length) return "";

  const sleeves = r.sleeves;
  const cone = r.cone;
  const joints = (r.joints || []).filter((j) => j.ok);
  const Htot = r.summary.totalHeight;
  const topA = r.input.topAllowance;
  const botA = r.input.bottomAllowance;

  const W = 780;
  const padT = 44;
  const plotH = 500;
  const axis = 410;
  const scaleY = plotH / Htot;
  const maxOut = Math.max(...sleeves.map((s) => s.outerOd), cone.topDia);
  const scaleR = Math.min(1.2, 155 / (maxOut / 2));

  const yAt = (z) => padT + z * scaleY;
  const xR = (d) => (d / 2) * scaleR;

  const y0 = yAt(0);
  const yH = yAt(Htot);
  const yCone0 = yAt(cone.z0);
  const yCone1 = yAt(cone.z1);

  // —— 绿色内锥（外轮廓=锥面；内孔略小示意壁厚）——
  const coneWall = Math.max(6, r.input.wall * 0.35);
  const cTop = cone.topDia;
  const cBot = cone.bottomDia;
  const iTop = Math.max(cTop - 2 * coneWall, cBot * 0.5);
  const iBot = Math.max(cBot - 2 * coneWall, 20);

  const green = `
    <path d="
      M ${axis - xR(cTop)} ${yCone0}
      L ${axis - xR(cBot)} ${yCone1}
      L ${axis - xR(iBot)} ${yCone1}
      L ${axis - xR(iTop)} ${yCone0}
      Z" fill="#3d9b5f" stroke="#2f4a56" stroke-width="1.1"/>
    <path d="
      M ${axis + xR(cTop)} ${yCone0}
      L ${axis + xR(cBot)} ${yCone1}
      L ${axis + xR(iBot)} ${yCone1}
      L ${axis + xR(iTop)} ${yCone0}
      Z" fill="#3d9b5f" stroke="#2f4a56" stroke-width="1.1"/>
    <line x1="${axis - xR(cTop)}" y1="${yCone0}" x2="${axis - xR(cBot)}" y2="${yCone1}"
      stroke="#e67e22" stroke-width="2"/>
    <line x1="${axis + xR(cTop)}" y1="${yCone0}" x2="${axis + xR(cBot)}" y2="${yCone1}"
      stroke="#e67e22" stroke-width="2"/>
  `;

  // —— 外套分段（套在锥外）——
  const sleevePaths = sleeves
    .map((s, i) => {
      const color = SLEEVE_COLORS[i % SLEEVE_COLORS.length];
      const yA = yAt(s.z0);
      const yB = yAt(s.z1);
      const out = xR(s.outerOd);
      const innA = xR(s.coneAtTop);
      const innB = xR(s.coneAtBot);
      // 右侧套筒截面
      const right = `M ${axis + innA} ${yA} L ${axis + out} ${yA} L ${axis + out} ${yB} L ${axis + innB} ${yB} Z`;
      const left = `M ${axis - innA} ${yA} L ${axis - out} ${yA} L ${axis - out} ${yB} L ${axis - innB} ${yB} Z`;
      // 节间搭接唇示意
      let lip = "";
      if (s.femaleSleeve && i < sleeves.length - 1) {
        const nest = Math.min(18, (yB - yA) * 0.2);
        const lipIn = out - xR(6);
        lip = `
          <path d="M ${axis + lipIn} ${yB} L ${axis + out} ${yB} L ${axis + out} ${yB + nest} L ${axis + lipIn} ${yB + nest} Z"
            fill="${color}" stroke="#2f4a56" stroke-width="1" opacity="0.95"/>
          <path d="M ${axis - lipIn} ${yB} L ${axis - out} ${yB} L ${axis - out} ${yB + nest} L ${axis - lipIn} ${yB + nest} Z"
            fill="${color}" stroke="#2f4a56" stroke-width="1" opacity="0.95"/>
        `;
      }
      return `
        <path d="${right}" fill="${color}" fill-opacity="0.72" stroke="#2f4a56" stroke-width="1.15"/>
        <path d="${left}" fill="${color}" fill-opacity="0.72" stroke="#2f4a56" stroke-width="1.15"/>
        ${lip}
        <text x="${axis + out + 8}" y="${(yA + yB) / 2 + 4}" fill="#2f4a56" font-size="10" font-weight="700">套${s.index}</text>
      `;
    })
    .join("");

  // 接头标注
  const jointLabels = joints
    .map((j) => {
      const y = yAt(j.z);
      const stack = (j.jointStack || []).map((x) => `${x.name}${x.h}`).join("+");
      return `
        <text x="24" y="${y - 2}" fill="#1f6f5b" font-size="9" font-weight="700">${j.designation}</text>
        <text x="24" y="${y + 11}" fill="#5c6b64" font-size="8">${stack}</text>
      `;
    })
    .join("");

  // 尺寸
  let dims = "";
  dims += dimV(86, y0, yH, `总高 ${t(Htot)}`, "#2f4a56");
  dims += dimV(118, yCone0, yCone1, `锥段 ${t(cone.height)}`, "#1f6f5b");
  dims += dimV(150, y0, yCone0, `上 ${t(topA)}`, "#c45c26");
  dims += dimV(150, yCone1, yH, `下 ${t(botA)}`, "#c45c26");
  sleeves.forEach((s) => {
    dims += dimV(182, yAt(s.z0), yAt(s.z1), `${t(s.length)}`, "#8a5a2a");
  });

  // 接头细节小图
  const detail = renderJointDetail(520, yH - 120, joints[0]);

  const legendY = yH + 34;
  const items = [
    `内锥（绿）ø${t(cone.topDia)} → ø${t(cone.bottomDia)} · 高 ${t(cone.height)}`,
    ...sleeves.map((s) => `外套${s.index} 外ø${t(s.outerOd)} · ${t(s.length)}mm（${s.kind}）· 贴锥 ${t(s.coneAtTop)}→${t(s.coneAtBot)}`),
    ...joints.map((j) => `接头${j.index} ${j.designation} @z=${t(j.z)} 锥径ø${t(j.coneDia)}`),
    `橙线=锥面；外套套在锥上；接头默认 12+1+10+1`,
  ];
  const legend = items
    .map((label, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      return `<text x="${20 + col * 370}" y="${legendY + row * 15}" fill="#5c6b64" font-size="9" font-weight="600">${label}</text>`;
    })
    .join("");
  const H = legendY + Math.ceil(items.length / 2) * 15 + 18;

  return `
  <svg viewBox="0 0 ${W} ${H}" class="diagram" role="img" aria-label="内锥加外套组装示意图">
    <text x="20" y="20" fill="#2f4a56" font-size="13" font-weight="800">组装示意图 · 内锥 + 外套分段</text>
    <text x="20" y="36" fill="#5c6b64" font-size="9">案例可改参数；默认 730 / ø194→ø108 / 上45·下5 / 节长210</text>
    ${sleevePaths}
    ${green}
    ${jointLabels}
    ${dims}
    <text x="${axis}" y="${yCone0 - 8}" text-anchor="middle" fill="#e67e22" font-size="11" font-weight="800">锥上口 ø${t(cone.topDia)}</text>
    <text x="${axis}" y="${yH + 16}" text-anchor="middle" fill="#e67e22" font-size="11" font-weight="800">锥下口 ø${t(cone.bottomDia)}</text>
    <line x1="${axis}" y1="${y0}" x2="${axis}" y2="${yH}" stroke="#9aa8a1" stroke-dasharray="4 3"/>
    ${detail}
    ${legend}
  </svg>`;
}

function renderJointDetail(x0, y0, joint) {
  const title = joint ? joint.designation : "12+1+10+1";
  return `
  <g transform="translate(${x0},${y0})">
    <rect width="220" height="112" rx="8" fill="#fff" stroke="#2f4a56"/>
    <text x="10" y="16" fill="#2f4a56" font-size="10" font-weight="700">接头细节 · ${title}</text>
    <!-- 外套红 -->
    <path d="M24,28 L95,28 L95,70 L82,70 L82,52 L40,52 L40,70 L24,70 Z" fill="#c45c5c" stroke="#2f4a56"/>
    <!-- 内锥绿 -->
    <path d="M40,40 L82,40 L78,100 L44,100 Z" fill="#3d9b5f" stroke="#2f4a56"/>
    <line x1="48" y1="40" x2="46" y2="100" stroke="#e67e22" stroke-width="1.6"/>
    <line x1="74" y1="40" x2="76" y2="100" stroke="#e67e22" stroke-width="1.6"/>
    <text x="108" y="40" fill="#c45c5c" font-size="9" font-weight="700">外套</text>
    <text x="108" y="56" fill="#5c6b64" font-size="8">旋合 12 · 间隙 1</text>
    <text x="108" y="70" fill="#5c6b64" font-size="8">止口 10 · 间隙 1</text>
    <text x="108" y="88" fill="#3d9b5f" font-size="9" font-weight="700">内锥贴合</text>
    <text x="108" y="102" fill="#e67e22" font-size="8">锥面连续</text>
  </g>`;
}

const renderAssembledConeDiagram = renderConeMoldDiagram;


const $ = (id) => document.getElementById(id);
let last = null;

function num(id, fallback) {
  const v = Number($(id).value);
  return Number.isFinite(v) ? v : fallback;
}

function fillSegTable(sleeves) {
  $("segTable").innerHTML = sleeves
    .map((s) => {
      const ends = [s.femaleSleeve ? "下搭接" : "", s.maleNeck ? "上承接" : ""].filter(Boolean).join("+") || "—";
      let note = "—";
      if (s.topFaceOffset != null) note = `含上余量 ${s.topFaceOffset}`;
      else if (s.bottomFaceOffset != null) note = `含下余量 ${s.bottomFaceOffset}`;
      return `<tr>
        <th scope="row">套${s.index}</th>
        <td>ø${s.coneAtTop}→ø${s.coneAtBot}</td>
        <td>ø${s.outerOd}</td>
        <td>${s.length} mm</td>
        <td>${s.kind}</td>
        <td>${s.wall} mm</td>
        <td>${ends}</td>
        <td>${note}</td>
      </tr>`;
    })
    .join("");
}

function fillJointTable(joints) {
  $("jointTable").innerHTML = joints
    .map((j) => {
      if (!j.ok) return `<tr><th>${j.index || "—"}</th><td colspan="6">${j.error}</td></tr>`;
      const stack = (j.jointStack || []).map((x) => `${x.name}${x.h}`).join("+");
      return `<tr>
        <th scope="row">${j.index}</th>
        <td>套外ø${j.fromOd} → ø${j.toOd}</td>
        <td>锥 ø${j.coneDia}</td>
        <td>${stack}</td>
        <td><strong>${j.designation}</strong></td>
        <td>${j.crest.external} / ${j.crest.internal}</td>
        <td>≥ ${j.minFemaleWall ?? "—"} mm</td>
      </tr>`;
    })
    .join("");
}

function renderSchema(sleeves, cone) {
  $("schema").innerHTML = `
    <div class="seg"><strong>内锥</strong><span>ø${cone.topDia}→ø${cone.bottomDia}<br/>高 ${cone.height} mm</span></div>
    <div class="arrow">+</div>
    ${sleeves
      .map(
        (s, i) =>
          `<div class="seg"><strong>外套${s.index}</strong><span>外ø${s.outerOd} · ${s.length}mm<br/>${s.kind}</span></div>${
            i < sleeves.length - 1 ? `<div class="arrow">↕</div>` : ""
          }`
      )
      .join("")}
  `;
}

function renderJointCards(joints) {
  $("jointCards").innerHTML = joints
    .filter((j) => j.ok && j.maleCard && j.femaleCard)
    .map((j) => {
      const maleRows = j.maleCard.rows.map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join("");
      const femaleRows = j.femaleCard.rows.map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join("");
      const stack = (j.jointStack || []).map((x) => `${x.name}${x.h}`).join(" + ");
      return `<article class="card joint-block">
        <h4>接头 ${j.index} · ${j.designation}</h4>
        <p class="muted" style="margin:0 0 10px">轴向：${stack}。${j.checkMessage}</p>
        <div class="card-pair">
          <div><h3 style="margin-top:0">公端（下套）</h3><table class="data"><tbody>${maleRows}</tbody></table></div>
          <div><h3 style="margin-top:0">母端（上套）</h3><table class="data"><tbody>${femaleRows}</tbody></table></div>
        </div>
      </article>`;
    })
    .join("");
}

function run() {
  const midRaw = $("midOds").value.trim();
  let preferredOuterOds;
  if (midRaw) {
    const ods = midRaw
      .split(/[,，\s]+/)
      .map((x) => Number(x))
      .filter((x) => Number.isFinite(x) && x > 0);
    if (ods.length) preferredOuterOds = ods;
  }

  const segRaw = $("segmentCount").value.trim();
  const r = designConeMold({
    coneTopDia: num("bigOd", CONE_MOLD_DEFAULTS.coneTopDia),
    coneBottomDia: num("smallOd", CONE_MOLD_DEFAULTS.coneBottomDia),
    totalHeight: num("moldHeight", CONE_MOLD_DEFAULTS.totalHeight),
    topAllowance: num("topAllowance", CONE_MOLD_DEFAULTS.topAllowance),
    bottomAllowance: num("bottomAllowance", CONE_MOLD_DEFAULTS.bottomAllowance),
    standardLen: num("standardLen", CONE_MOLD_DEFAULTS.standardLen),
    wall: num("wall", CONE_MOLD_DEFAULTS.wall),
    segmentCount: segRaw === "" ? undefined : Number(segRaw),
    preferredOuterOds,
    roundThread: true,
  });

  if (!r.ok) {
    last = null;
    $("status").textContent = r.error;
    $("status").className = "status error";
    $("warnBox").classList.remove("show");
    $("assyDiagram").innerHTML = `<p class="muted">无法绘图：${r.error}</p>`;
    $("summaryLine").textContent = "";
    return;
  }

  last = r;
  $("status").textContent = `案例已生成：总高 ${r.summary.totalHeight}，内锥 ${r.summary.coneHeight}，外套 ${r.segmentCount} 节 / 接头 ${r.summary.jointCount}`;
  $("status").className = "status ok";
  $("summaryLine").textContent = `内锥 ø${r.summary.coneTopDia}→ø${r.summary.coneBottomDia} · 总高 ${r.summary.totalHeight}（上${r.input.topAllowance}+锥${r.summary.coneHeight}+下${r.input.bottomAllowance}）· ${r.summary.nestNote}`;
  $("assyDiagram").innerHTML = renderAssembledConeDiagram(r);
  renderSchema(r.sleeves, r.cone);
  fillSegTable(r.sleeves);
  fillJointTable(r.joints);
  renderJointCards(r.joints);

  const warns = r.joints.filter((j) => j.ok && j.minFemaleWall != null).map((j) => `接头${j.index}≥${j.minFemaleWall}mm`);
  if (warns.length) {
    $("warnBox").textContent = "外套局部需加厚：" + warns.join("；");
    $("warnBox").classList.add("show");
  } else $("warnBox").classList.remove("show");
}

async function copy() {
  if (!last) {
    $("status").textContent = "请先生成";
    $("status").className = "status error";
    return;
  }
  const nl = String.fromCharCode(10);
  const tab = String.fromCharCode(9);
  const lines = [
    `内锥+外套 总高${last.summary.totalHeight} 锥ø${last.summary.coneTopDia}→${last.summary.coneBottomDia}`,
    ...last.sleeves.map((s) => `套${s.index}${tab}外${s.outerOd}${tab}${s.length}${tab}锥${s.coneAtTop}→${s.coneAtBot}`),
    ...last.joints.filter((j) => j.ok).map((j) => `接头${j.index}${tab}${j.designation}${tab}锥${j.coneDia}`),
  ];
  const text = lines.join(nl);
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  $("status").textContent = "已复制";
  $("status").className = "status ok";
}

$("calcBtn").addEventListener("click", run);
$("copyBtn").addEventListener("click", copy);
["bigOd", "smallOd", "moldHeight", "topAllowance", "bottomAllowance", "standardLen", "wall", "segmentCount", "midOds"].forEach(
  (id) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener("change", run);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        run();
      }
    });
  }
);

run();

</script>
</body>
</html>
