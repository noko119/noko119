<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>接管端头螺纹计算</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  
  
<style>
:root {
  --ink: #1a2420;
  --muted: #5c6b64;
  --paper: #eef3ef;
  --panel: rgba(255, 255, 255, 0.78);
  --line: rgba(26, 36, 32, 0.12);
  --accent: #c45c26;
  --accent-2: #1f6f5b;
  --steel: #2f4a56;
  --shadow: 0 18px 40px rgba(31, 52, 44, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "Noto Sans SC", sans-serif;
  --font-body: "Noto Sans SC", "Outfit", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  font-family: var(--font-body);
  background: var(--paper);
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(900px 500px at 8% -5%, rgba(196, 92, 38, 0.16), transparent 55%),
    radial-gradient(700px 420px at 92% 8%, rgba(31, 111, 91, 0.14), transparent 50%),
    linear-gradient(165deg, #f5f7f4 0%, #e7eee9 42%, #dfe8e3 100%);
  overflow: hidden;
}

.atmosphere::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(47, 74, 86, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47, 74, 86, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 40% 20%, black 20%, transparent 75%);
  animation: gridDrift 18s linear infinite;
}

@keyframes gridDrift {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-28px, -28px, 0); }
}

.shell {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
  padding: 36px 0 64px;
}

.hero {
  margin-bottom: 28px;
  animation: rise 0.7s ease both;
}

.brand {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.18em;
  font-size: 13px;
  color: var(--accent);
}

.hero h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--steel);
}

.lede {
  margin: 12px 0 0;
  max-width: 36rem;
  color: var(--muted);
  font-size: 1.02rem;
  line-height: 1.55;
}

.panel {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  animation: rise 0.75s ease 0.08s both;
}

.field-row {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 12px;
}

.field-row.simple {
  grid-template-columns: 1.8fr 1fr 1fr;
}

.field-row.free {
  grid-template-columns: 1fr 1fr 1fr 1.4fr;
}

.hint {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field.grow { grid-column: span 1; }

.field span {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}

.field input,
.field select {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 12px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus,
.field select:focus {
  border-color: rgba(196, 92, 38, 0.55);
  box-shadow: 0 0 0 3px rgba(196, 92, 38, 0.15);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.chip {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--steel);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
}

.chip:hover {
  transform: translateY(-1px);
  border-color: rgba(31, 111, 91, 0.35);
  background: #f3faf7;
}

.chip.active {
  background: var(--accent-2);
  border-color: var(--accent-2);
  color: #fff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

.btn {
  height: 42px;
  border-radius: 12px;
  border: 1px solid transparent;
  padding: 0 16px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
}

.btn:hover { transform: translateY(-1px); }

.btn.primary {
  background: linear-gradient(135deg, #c45c26, #a84718);
  color: #fff;
  box-shadow: 0 10px 22px rgba(196, 92, 38, 0.28);
}

.btn.ghost {
  background: #fff;
  border-color: var(--line);
  color: var(--steel);
}

.status {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.status.error { color: #b42318; }
.status.ok { color: var(--accent-2); }

.result-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 18px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  animation: rise 0.65s ease both;
}

.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.2s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.3s; }

.designation-card {
  grid-column: 1 / -1;
}

.span-2 { grid-column: 1 / -1; }

.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 2rem;
  letter-spacing: -0.02em;
  color: var(--steel);
}

.card h3 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--steel);
}

.muted { color: var(--muted); margin: 6px 0 0; font-size: 14px; }

.diagram {
  width: 100%;
  height: auto;
  margin-top: 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, #f8fbf9, #e8f0eb);
  border: 1px solid var(--line);
}

.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.data caption {
  caption-side: top;
  text-align: left;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--steel);
}

.data th,
.data td {
  padding: 9px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: baseline;
}

.data th {
  color: var(--muted);
  font-weight: 500;
  width: 58%;
}

.data td {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--ink);
}

.data tr:last-child th,
.data tr:last-child td { border-bottom: 0; }

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.formula {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.footnote {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 860px) {
  .field-row,
  .field-row.simple,
  .field-row.free {
    grid-template-columns: 1fr 1fr;
  }
  .field.grow { grid-column: 1 / -1; }
  .result-grid { grid-template-columns: 1fr; }
  .designation-card,
  .span-2 { grid-column: auto; }
  .split { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .shell { width: min(100% - 20px, 1120px); padding-top: 24px; }
  .field-row,
  .field-row.simple,
  .field-row.free { grid-template-columns: 1fr; }
  .actions { align-items: stretch; }
  .btn { width: 100%; }
}


.const-bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.const-bar span{font-size:12px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--steel)}
.warn-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff4f0;border:1px solid #f0b090;color:#8a2e0e;font-weight:700;display:none}
.warn-box.show{display:block}
.ok-box{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eef8f3;border:1px solid #9dceb8;color:#1f6f5b;font-weight:700;display:none}
.ok-box.show{display:block}
.field-row.four{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.field-row.four{grid-template-columns:1fr 1fr}}
.diagram-wrap{margin-top:14px}
.diagram-wrap .diagram{display:block;width:100%;min-height:280px;height:auto;margin-top:10px;background:linear-gradient(180deg,#f8fbf9,#e8f0eb);border:1px solid rgba(26,36,32,.12);border-radius:14px}
input[readonly]{background:#f3f6f4;color:var(--steel)}

</style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">PIPE END THREAD</p>
      <h1>接管端头螺纹计算</h1>
      <p class="lede">先按管径壁厚推荐螺纹；也可手动改规格后重新出数据与剖面尺寸图。P=2 固定，大径就近取整。</p>
    </header>

    <section class="panel">
      <div class="const-bar" aria-label="固定常量">
        <span>止口 10mm</span>
        <span>P=2 · 6圈 · 旋合 12mm</span>
        <span>60° 三角螺纹 · GB/T 196</span>
        <span>接管总长 210mm（含止口+螺纹+退刀槽）</span>
      </div>

      <div class="field-row four">
        <label class="field">
          <span>① 小管外径 D₁ / mm</span>
          <input id="D1" type="number" min="0.1" step="any" value="168" />
        </label>
        <label class="field">
          <span>② 小管壁厚 t₁ / mm</span>
          <input id="t1" type="number" min="0.1" step="any" value="8" />
        </label>
        <label class="field">
          <span>③ 大管外径 D₂ / mm</span>
          <input id="D2" type="number" min="0.1" step="any" value="180" />
        </label>
        <label class="field">
          <span>④ 大管壁厚 t₂ / mm</span>
          <input id="t2" type="number" min="0.1" step="any" value="12" />
        </label>
      </div>

      <div class="field-row" style="margin-top:12px;grid-template-columns:1.2fr 1.4fr 1fr auto">
        <label class="field">
          <span>系统推荐规格</span>
          <input id="recommendOut" type="text" value="" readonly />
        </label>
        <label class="field">
          <span>手动给定规格（可改，如 M160×2 或 160）</span>
          <input id="manualSpec" type="text" value="" placeholder="留空=用推荐；或输入 M160×2" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span>退刀槽长度档</span>
          <select id="grooveKind">
            <option value="normal" selected>普通 g1</option>
            <option value="short">短 g2</option>
            <option value="long">长 g3</option>
          </select>
        </label>
        <div class="actions" style="margin:0;align-self:end;flex-wrap:wrap">
          <button type="button" class="btn primary" id="calcBtn">生成/重算</button>
          <button type="button" class="btn ghost" id="useRecBtn">采用推荐</button>
          <button type="button" class="btn ghost" id="copyBtn">复制结果</button>
        </div>
      </div>
      <div class="chips" id="nearbyChips" aria-label="邻近规格" style="margin-top:12px"></div>
      <p class="hint" id="hint" style="margin-top:10px">流程：填管径壁厚 → 看推荐 → 可手动改规格 → 点生成/重算，刷新数据与示意图。</p>
      <p class="status" id="status" role="status"></p>
      <div class="warn-box" id="warnBox"></div>
      <div class="ok-box" id="okBox"></div>
    </section>

    <section class="result-grid" id="results" hidden>
      <article class="card designation-card">
        <h2 id="title">—</h2>
        <p class="muted" id="meta"></p>
        <div id="maleSvg" class="diagram-wrap"></div>
        <div id="femaleSvg" class="diagram-wrap"></div>
        <div id="assySvg" class="diagram-wrap"></div>
      </article>
      <article class="card span-2">
        <h3>输出结果</h3>
        <table class="data"><tbody id="outTable"></tbody></table>
      </article>
      <article class="card">
        <h3>公扣端头结构（计入 210）</h3>
        <table class="data"><tbody id="maleTable"></tbody></table>
      </article>
      <article class="card">
        <h3>母扣端头内腔（计入 210）</h3>
        <table class="data"><tbody id="femaleTable"></tbody></table>
      </article>
      <article class="card span-2">
        <h3>装配说明</h3>
        <p class="footnote" id="assy" style="margin:0;font-size:14px;color:var(--muted)"></p>
      </article>
    </section>
  </main>
  <script>
/**
 * 接管端头螺纹完整计算逻辑
 * - P=2 固定；60° 三角螺纹；牙型按 GB/T 196
 * - 螺纹中心线落在小管管壁中心；同时校验大管壁不击穿
 * - 螺纹大径就近取整数（不强制尾数 0/5）
 */

/** @typedef {{ D1: number, t1: number, D2: number, t2: number }} PipeEndInput */

const PIPE_END_CONST = {
  locatorLen: 10, // 定位止口 mm
  pitch: 2, // 螺距 P mm
  turns: 6, // 旋合圈数
  engageLen: 12, // 6×P
  bodyTotalLen: 210, // 接管本体总长 mm
  tipAngle: 60,
  // GB/T 196 / 常用牙型系数（相对螺距）
  H_factor: 0.866, // 原始牙高 H = 0.8660×P
  h_factor: 0.5413, // 工作牙高 h
  R_factor: 0.144, // 牙底最大圆角 R
};

/** GB/T 3 退刀槽（P=2 常用） */
const UNDERCUT_P2 = {
  external: { g1: 4.0, g2: 3.0, g3: 6.0, k: 3.0, r: 0.8 },
  internal: { g1: 4.0, g2: 3.0, g3: 6.0, m: 3.0, r: 0.8 },
};

function round3(n) {
  return Math.round(n * 1000) / 1000;
}

function nearInt(n) {
  return Math.round(n);
}

/** 解析手动规格：M161×2 / M161X2 / 161 */
function parseManualMajor(raw, defaultPitch = PIPE_END_CONST.pitch) {
  const s = String(raw || "")
    .trim()
    .replace(/\s+/g, "")
    .replace(/[×✕✖ｘＸxX＊*－—–−-]/g, "x");
  if (!s) return { ok: false, error: "请输入手动规格，如 M161×2 或 161" };
  let m = s.match(/^M(\d+(?:\.\d+)?)(?:x(\d+(?:\.\d+)?))?$/i);
  if (m) {
    const major = Math.round(Number(m[1]));
    const pitch = m[2] != null ? Number(m[2]) : defaultPitch;
    if (!(major > 0)) return { ok: false, error: "螺纹大径无效" };
    if (Math.abs(pitch - defaultPitch) > 1e-9) {
      return { ok: false, error: `本工具螺距固定为 P=${defaultPitch}，请写 M${major}×${defaultPitch}` };
    }
    return { ok: true, majorDia: major, pitch: defaultPitch };
  }
  if (/^\d+(?:\.\d+)?$/.test(s)) {
    const major = Math.round(Number(s));
    if (!(major > 0)) return { ok: false, error: "螺纹大径无效" };
    return { ok: true, majorDia: major, pitch: defaultPitch };
  }
  return { ok: false, error: "无法识别。支持：M161×2、M161X2、161" };
}

/**
 * @param {PipeEndInput} input
 * @param {{ grooveKind?: 'normal'|'short'|'long', majorDia?: number, designation?: string }} [opt]
 */
function computePipeEndThread(input, opt = {}) {
  const { D1, t1, D2, t2 } = input;
  const errors = [];
  const warnings = [];

  if (!(D1 > 0) || !(t1 > 0) || !(D2 > 0) || !(t2 > 0)) {
    return { ok: false, error: "请完整填写 D₁、t₁、D₂、t₂（均须大于 0）" };
  }
  if (t1 * 2 >= D1) {
    return { ok: false, error: "小管壁厚无效：2×t₁ 不得大于等于 D₁" };
  }
  if (t2 * 2 >= D2) {
    return { ok: false, error: "大管壁厚无效：2×t₂ 不得大于等于 D₂" };
  }
  if (D1 >= D2) {
    warnings.push("通常公头小管外径 D₁ 应小于母头大管外径 D₂，请确认录入是否正确");
  }

  const P = PIPE_END_CONST.pitch;
  const H = round3(PIPE_END_CONST.H_factor * P);
  const h = round3(PIPE_END_CONST.h_factor * P);
  const R = round3(PIPE_END_CONST.R_factor * P);

  // 1. 小管管壁中心直径
  const smallCenterDia = round3(D1 - t1);

  // 3–4. 理论外螺纹大径 / 内螺纹小径
  const theoryMajor = round3(smallCenterDia + h);
  const theoryMinor = round3(smallCenterDia - h);

  // 5. 大管内孔
  const largeBore = round3(D2 - 2 * t2);

  // 推荐大径（就近取整）
  const recommendedMajor = nearInt(theoryMajor);
  const recommendedDesignation = `M${recommendedMajor}×${P}`;

  // 最终采用：手动覆盖 > 推荐
  let majorDia = recommendedMajor;
  let isManual = false;
  if (opt.majorDia != null && Number.isFinite(Number(opt.majorDia))) {
    majorDia = Math.round(Number(opt.majorDia));
    isManual = majorDia !== recommendedMajor;
  } else if (opt.designation) {
    const parsed = parseManualMajor(opt.designation, P);
    if (!parsed.ok) return parsed;
    majorDia = parsed.majorDia;
    isManual = majorDia !== recommendedMajor;
  }
  if (!(majorDia > 0)) {
    return { ok: false, error: "螺纹大径无效" };
  }

  const designation = `M${majorDia}×${P}`;

  // 选定规格后：母扣内螺纹小径按工作牙高对称匹配（大径 − 2h）
  const internalMinor = round3(majorDia - 2 * h);
  // GB/T 196 基本小径（对照）
  const gbD1 = round3(majorDia - 1.082531755 * P);
  const gbD2 = round3(majorDia - 0.649519053 * P);
  const gbD3 = round3(majorDia - 1.226869322 * P);

  // 校验：内螺纹小径须大于大管内孔，保证加工在实体内、不打穿
  const pierceOk = internalMinor > largeBore;
  // 螺纹不超出大管外径实体
  const withinLargeOd = majorDia < D2;
  // 螺纹大致落在大管壁厚实体带内（大径小于外径，啮合区高于内孔）
  const withinLargeWall = majorDia <= D2 && internalMinor >= largeBore;
  // 相对小管：大径不超过小管外径，小径不低于小管内孔
  const smallBore = round3(D1 - 2 * t1);
  const withinSmall = majorDia <= D1 && internalMinor >= smallBore;

  let checkPass = true;
  let checkMessage = "满足：内螺纹位于大管实体内，未击穿管壁";

  if (!pierceOk) {
    checkPass = false;
    checkMessage = "当前参数无法加工，管壁厚度不足";
    warnings.push(checkMessage);
  } else if (!withinLargeOd) {
    checkPass = false;
    checkMessage = "当前参数无法加工，管壁厚度不足（螺纹大径超出大管外径）";
    warnings.push(checkMessage);
  } else if (!withinSmall) {
    warnings.push("提示：螺纹相对小管壁中心偏移后，可能接近或超出小管壁实体边界，请复核");
  }

  if (isManual) {
    warnings.push(`当前为手动规格 ${designation}（系统推荐 ${recommendedDesignation}）`);
  }

  const grooveKind = opt.grooveKind || "normal";
  const widthKey = grooveKind === "short" ? "g2" : grooveKind === "long" ? "g3" : "g1";
  const extGrooveW = UNDERCUT_P2.external[widthKey];
  const intGrooveW = UNDERCUT_P2.internal[widthKey];
  const extGrooveDf = round3(majorDia - UNDERCUT_P2.external.k);
  const intGrooveDg = round3(majorDia + UNDERCUT_P2.internal.m);

  const maleEndLen = round3(
    PIPE_END_CONST.locatorLen + PIPE_END_CONST.engageLen + extGrooveW
  );
  const femaleEndLen = round3(
    PIPE_END_CONST.locatorLen + PIPE_END_CONST.engageLen + intGrooveW
  );

  const fitInBody =
    maleEndLen <= PIPE_END_CONST.bodyTotalLen &&
    femaleEndLen <= PIPE_END_CONST.bodyTotalLen;
  if (!fitInBody) {
    warnings.push("端头结构长度超过接管总长 210mm，请检查退刀槽长度档");
  }

  const jointLabel = `${trim(D1)}×${trim(t1)} → ${trim(D2)}×${trim(t2)}`;
  const jointKind =
    D2 > D1 ? (D2 / D1 <= 1.25 ? "相邻规格对接" : "跨规格对接") : "对接组合";

  // 邻近可选规格（推荐 ±2）
  const nearby = [-2, -1, 0, 1, 2].map((d) => {
    const maj = recommendedMajor + d;
    return {
      majorDia: maj,
      designation: `M${maj}×${P}`,
      isRecommended: d === 0,
    };
  });

  return {
    ok: true,
    checkPass,
    checkMessage,
    warnings,
    errors,
    constants: { ...PIPE_END_CONST, H, h, R },
    input: { D1, t1, D2, t2 },
    jointCombo: jointLabel,
    jointKind,
    D1,
    D2,
    t1,
    t2,
    P,
    H,
    h,
    R,
    smallCenterDia,
    theoryMajor,
    theoryMinor,
    largeBore,
    smallBore,
    recommendedMajor,
    recommendedDesignation,
    isManual,
    majorDia,
    designation,
    nearby,
    femaleInternal: {
      designation,
      minor: internalMinor,
      pitchDia: gbD2,
      major: majorDia,
      note: "母扣内螺纹配套公扣所选规格，小径按中心对称（大径−2h）匹配",
    },
    gbBasic: { d: majorDia, d2: gbD2, d1: gbD1, d3: gbD3, D1: gbD1, D2: gbD2, D: majorDia },
    wallCheck: {
      pierceOk,
      withinLargeOd,
      withinLargeWall,
      withinSmall,
      pass: checkPass,
      message: checkMessage,
    },
    maleEnd: {
      locator: PIPE_END_CONST.locatorLen,
      thread: PIPE_END_CONST.engageLen,
      undercutWidth: extGrooveW,
      undercutDf: extGrooveDf,
      undercutR: UNDERCUT_P2.external.r,
      total: maleEndLen,
    },
    femaleEnd: {
      locator: PIPE_END_CONST.locatorLen,
      thread: PIPE_END_CONST.engageLen,
      undercutWidth: intGrooveW,
      undercutDg: intGrooveDg,
      undercutR: UNDERCUT_P2.internal.r,
      total: femaleEndLen,
    },
    bodyTotalLen: PIPE_END_CONST.bodyTotalLen,
    fitInBody,
    assemblyNote:
      "装配时公头定位止口先插入母扣止口导向，再旋入实现 12mm 完全啮合；退刀槽供车削退刀。工况：静止装配、无载荷、仅定位锁紧。",
  };
}

function trim(n) {
  const s = String(Number(Number(n).toFixed(3)));
  if (!s.includes(".")) return s;
  return s.replace(/\.?0+$/, "");
}

/**
 * 接管端头剖面尺寸标注图（公扣外螺纹 / 母扣内螺纹）
 * 字号偏小，径向标注错开，避免重叠
 */

function t(n) {
  const s = String(Number(Number(n).toFixed(3)));
  return s.includes(".") ? s.replace(/\.?0+$/, "") : s;
}

function dimH(x1, x2, y, label, color = "#c45c26") {
  const mid = (x1 + x2) / 2;
  return `
    <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="1"/>
    <line x1="${x1}" y1="${y - 4}" x2="${x1}" y2="${y + 4}" stroke="${color}" stroke-width="1"/>
    <line x1="${x2}" y1="${y - 4}" x2="${x2}" y2="${y + 4}" stroke="${color}" stroke-width="1"/>
    <text x="${mid}" y="${y - 6}" text-anchor="middle" fill="${color}" font-size="10" font-weight="600">${label}</text>
  `;
}

/**
 * 竖向尺寸。labelMode:
 * - mid: 标在尺寸线中部旁（默认）
 * - top: 标在尺寸线上端外侧
 * - bottom: 标在尺寸线下端（靠近轴线）外侧
 * - out: 引出到画布外固定 x
 */
function dimV(x, y1, y2, label, color = "#1f6f5b", opts = {}) {
  const {
    align = "right",
    labelMode = "mid",
    outX = null,
    fontSize = 10,
  } = opts;
  const mid = (y1 + y2) / 2;
  let tx;
  let ty;
  let anchor;
  let leader = "";

  if (labelMode === "top") {
    tx = align === "right" ? x + 6 : x - 6;
    ty = Math.min(y1, y2) - 4;
    anchor = align === "right" ? "start" : "end";
  } else if (labelMode === "bottom") {
    tx = align === "right" ? x + 6 : x - 6;
    ty = Math.max(y1, y2) - 4;
    anchor = align === "right" ? "start" : "end";
  } else if (labelMode === "out" && outX != null) {
    tx = outX;
    ty = mid + 3;
    anchor = "start";
    leader = `<line x1="${x}" y1="${mid}" x2="${outX - 4}" y2="${mid}" stroke="${color}" stroke-width="0.8" stroke-dasharray="2 2"/>`;
  } else {
    tx = align === "right" ? x + 6 : x - 6;
    ty = mid + 3;
    anchor = align === "right" ? "start" : "end";
  }

  return `
    <line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="1"/>
    <line x1="${x - 4}" y1="${y1}" x2="${x + 4}" y2="${y1}" stroke="${color}" stroke-width="1"/>
    <line x1="${x - 4}" y1="${y2}" x2="${x + 4}" y2="${y2}" stroke="${color}" stroke-width="1"/>
    ${leader}
    <text x="${tx}" y="${ty}" text-anchor="${anchor}" fill="${color}" font-size="${fontSize}" font-weight="600">${label}</text>
  `;
}

function teethPolyline(x0, x1, yCrest, yRoot, pitchPx) {
  const pts = [];
  let x = x0;
  let up = true;
  pts.push([x, yCrest]);
  while (x < x1 - 1) {
    const nx = Math.min(x + pitchPx / 2, x1);
    pts.push([nx, up ? yRoot : yCrest]);
    up = !up;
    x = nx;
  }
  pts.push([x1, yCrest]);
  return pts.map(([a, b]) => `${a},${b}`).join(" ");
}

const $ = (id) => document.getElementById(id);

let last = null;
let syncing = false;

function num(id) {
  return Number($(id).value);
}

function fill(tbody, rows) {
  tbody.innerHTML = rows
    .map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`)
    .join("");
}

function baseInput() {
  return { D1: num("D1"), t1: num("t1"), D2: num("D2"), t2: num("t2") };
}

/** 仅刷新推荐框（不强制覆盖手动输入） */
function refreshRecommend() {
  const preview = computePipeEndThread(baseInput(), {
    grooveKind: $("grooveKind").value,
  });
  if (!preview.ok) {
    $("recommendOut").value = "";
    return null;
  }
  $("recommendOut").value = preview.recommendedDesignation;
  return preview;
}

function renderNearby(r) {
  const box = $("nearbyChips");
  if (!r?.nearby) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = r.nearby
    .map((n) => {
      const active = n.majorDia === r.majorDia ? " active" : "";
      const tag = n.isRecommended ? "（推荐）" : "";
      return `<button type="button" class="chip${active}" data-maj="${n.majorDia}">${n.designation}${tag}</button>`;
    })
    .join("");
}

function run(forceManual) {
  const warnBox = $("warnBox");
  const okBox = $("okBox");
  warnBox.classList.remove("show");
  okBox.classList.remove("show");

  const preview = refreshRecommend();
  if (!preview) {
    const bad = computePipeEndThread(baseInput());
    $("results").hidden = true;
    $("status").textContent = bad.error || "输入无效";
    $("status").className = "status error";
    warnBox.textContent = bad.error || "输入无效";
    warnBox.classList.add("show");
    last = null;
    return;
  }

  const opt = { grooveKind: $("grooveKind").value };
  const manualRaw = $("manualSpec").value.trim();

  if (forceManual === false) {
    // 采用推荐
    opt.majorDia = preview.recommendedMajor;
    syncing = true;
    $("manualSpec").value = preview.recommendedDesignation;
    syncing = false;
  } else if (manualRaw) {
    const parsed = parseManualMajor(manualRaw);
    if (!parsed.ok) {
      $("status").textContent = parsed.error;
      $("status").className = "status error";
      warnBox.textContent = parsed.error;
      warnBox.classList.add("show");
      return;
    }
    opt.majorDia = parsed.majorDia;
  } else {
    opt.majorDia = preview.recommendedMajor;
    syncing = true;
    $("manualSpec").value = preview.recommendedDesignation;
    syncing = false;
  }

  const r = computePipeEndThread(baseInput(), opt);
  if (!r.ok) {
    $("results").hidden = true;
    $("status").textContent = r.error;
    $("status").className = "status error";
    warnBox.textContent = r.error;
    warnBox.classList.add("show");
    last = null;
    return;
  }

  last = r;
  $("results").hidden = false;
  $("title").textContent = r.designation;
  $("meta").textContent = `${r.isManual ? "手动规格" : "推荐规格"} · ${r.jointKind} · ${r.jointCombo} · 推荐 ${r.recommendedDesignation} · 理论大径 ${r.theoryMajor} → 采用 ${r.majorDia}`;

  syncing = true;
  $("manualSpec").value = r.designation;
  $("recommendOut").value = r.recommendedDesignation;
  syncing = false;

  $("maleSvg").innerHTML = renderMaleDiagram(r);
  $("femaleSvg").innerHTML = renderFemaleDiagram(r);
  $("assySvg").innerHTML = renderAssemblyDiagram(r);
  renderNearby(r);

  fill($("outTable"), pipeEndToRows(r));
  fill($("maleTable"), [
    ["定位止口", `${r.maleEnd.locator} mm`],
    ["螺纹有效旋合段", `${r.maleEnd.thread} mm`],
    ["外螺纹退刀槽宽", `${r.maleEnd.undercutWidth} mm`],
    ["退刀槽底径 df", `${r.maleEnd.undercutDf} mm`],
    ["端头合计", `${r.maleEnd.total} mm`],
  ]);
  fill($("femaleTable"), [
    ["定位止口接收段", `${r.femaleEnd.locator} mm`],
    ["内螺纹旋合段", `${r.femaleEnd.thread} mm`],
    ["内螺纹退刀槽宽", `${r.femaleEnd.undercutWidth} mm`],
    ["退刀槽底径 Dg", `${r.femaleEnd.undercutDg} mm`],
    ["内腔合计", `${r.femaleEnd.total} mm`],
  ]);
  $("assy").textContent = r.assemblyNote;

  if (!r.checkPass) {
    warnBox.textContent = r.checkMessage;
    warnBox.classList.add("show");
    $("status").textContent = r.checkMessage;
    $("status").className = "status error";
  } else {
    okBox.textContent = r.checkMessage;
    okBox.classList.add("show");
    $("status").textContent = r.isManual
      ? `已按手动规格重算 ${r.designation}（推荐 ${r.recommendedDesignation}）`
      : `已按推荐生成 ${r.designation}`;
    $("status").className = "status ok";
    const extra = r.warnings.filter((w) => !w.includes("手动规格"));
    if (extra.length) {
      warnBox.textContent = extra.join("；");
      warnBox.classList.add("show");
    }
  }
}

async function copy() {
  if (!last) {
    $("status").textContent = "请先生成数据";
    $("status").className = "status error";
    return;
  }
  const nl = String.fromCharCode(10);
  const tab = String.fromCharCode(9);
  const text = pipeEndToRows(last)
    .map(([k, v]) => `${k}${tab}${v}`)
    .join(nl);
  try {
    await navigator.clipboard.writeText(text);
    $("status").textContent = "结果已复制";
    $("status").className = "status ok";
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    $("status").textContent = "结果已复制";
    $("status").className = "status ok";
  }
}

$("calcBtn").addEventListener("click", () => run(true));
$("useRecBtn").addEventListener("click", () => run(false));
$("copyBtn").addEventListener("click", copy);

$("nearbyChips").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  syncing = true;
  $("manualSpec").value = `M${btn.dataset.maj}×2`;
  syncing = false;
  run(true);
});

["D1", "t1", "D2", "t2", "grooveKind"].forEach((id) => {
  $(id).addEventListener("change", () => run(true));
  $(id).addEventListener("input", () => {
    clearTimeout($(id)._t);
    $(id)._t = setTimeout(() => {
      refreshRecommend();
      run(true);
    }, 150);
  });
});

$("manualSpec").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    run(true);
  }
});

run(false);

</script>
</body>
</html>
