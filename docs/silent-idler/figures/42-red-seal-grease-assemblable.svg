<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 26px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .sub { font: 400 14px "WenQuanYi Micro Hei", sans-serif; fill:#444; }
      .h { font: 700 16px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .t { font: 400 14px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .ok { font: 700 14px "WenQuanYi Micro Hei", sans-serif; fill:#0a7; }
      .w { font: 700 13px "WenQuanYi Micro Hei", sans-serif; fill:#a60; }
      .bad { font: 700 13px "WenQuanYi Micro Hei", sans-serif; fill:#c0392b; }
      .s { font: 400 12px "WenQuanYi Micro Hei", sans-serif; fill:#555; }
      .box { fill:#fffdf8; stroke:#bfb6a3; }
    ]]></style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1400" height="1050" fill="#f2eee4"/>
  <text x="40" y="38" class="title">红色四道密封 · 改法（保留腔间润滑脂 + 能装）</text>
  <text x="40" y="66" class="sub">“润滑纸”=润滑脂。四道之间必须有脂：防尘 + 端部隔音。改进也要件件之间填脂，并满足轴向压装工艺。</text>

  <!-- ========== TOP: CORRECTED IMPROVED SECTION ========== -->
  <g transform="translate(40,85)">
    <rect x="0" y="0" width="1320" height="380" class="box"/>
    <text x="20" y="32" class="h">改进后剖面（可轴向压装，不是齿对齿卡死）</text>

    <!-- shaft -->
    <rect x="60" y="180" width="900" height="48" fill="#6b2c1a"/>
    <text x="900" y="210" class="s" fill="#fff">轴（固定）</text>

    <!-- yellow stator - on shaft, simple L / cup that accepts axial slide-on of purple -->
    <!-- stator body: sits on shaft, has 3 annular grease grooves / steps facing OUT so purple can slide over -->
    <path d="M120,100 L200,100 L200,180 L160,180 L160,228 L120,228 Z"
          fill="#f4d03f" stroke="#9a7d0a" stroke-width="2"/>
    <!-- stator annular ridges - open radially outward / axially open for assembly -->
    <rect x="200" y="130" width="70" height="18" fill="#f4d03f" stroke="#9a7d0a" stroke-width="1.5"/>
    <rect x="200" y="160" width="110" height="18" fill="#f4d03f" stroke="#9a7d0a" stroke-width="1.5"/>
    <text x="120" y="90" class="s">①黄封公（先装轴上）</text>

    <!-- purple rotor - cup from outside, slides axially over yellow ridges with clearance -->
    <path d="M220,80 L520,80 L520,120 L280,120 L280,155 L240,155 L240,100 L220,100 Z"
          fill="#8e44ad" stroke="#5b2c6f" stroke-width="2"/>
    <!-- purple downward teeth that clear yellow - leave axial gaps -->
    <rect x="290" y="120" width="50" height="28" fill="#8e44ad" stroke="#5b2c6f"/>
    <rect x="370" y="120" width="50" height="35" fill="#8e44ad" stroke="#5b2c6f"/>
    <rect x="450" y="120" width="50" height="28" fill="#8e44ad" stroke="#5b2c6f"/>
    <text x="350" y="70" class="s" fill="#5b2c6f">②紫封母（后套入，轴向推进）</text>

    <!-- GREASE between all chambers - yellow fill -->
    <rect x="200" y="148" width="70" height="12" fill="#f9e79f"/>
    <rect x="270" y="148" width="20" height="32" fill="#f9e79f"/>
    <rect x="200" y="178" width="110" height="8" fill="#f9e79f"/>
    <rect x="340" y="148" width="30" height="32" fill="#f9e79f"/>
    <rect x="420" y="148" width="30" height="32" fill="#f9e79f"/>
    <rect x="500" y="148" width="40" height="32" fill="#f9e79f"/>

    <!-- THREE soft grease chambers with light contact OR near-contact rings - redesigned as stacked soft washers that assemble -->
    <!-- Chamber walls as soft red annular partitions - only OUTERMOST contacts shaft lightly -->
    <!-- red soft partitions hanging from purple, forming 3 grease pockets -->
    <rect x="530" y="100" width="14" height="78" fill="#e74c3c" stroke="#922b21" stroke-width="1.5"/>
    <rect x="580" y="100" width="14" height="78" fill="#e74c3c" stroke="#922b21" stroke-width="1.5"/>
    <rect x="630" y="100" width="14" height="78" fill="#e74c3c" stroke="#922b21" stroke-width="1.5"/>
    <!-- grease between red partitions -->
    <rect x="544" y="110" width="36" height="60" fill="#f9e79f" fill-opacity="0.85"/>
    <rect x="594" y="110" width="36" height="60" fill="#f9e79f" fill-opacity="0.85"/>
    <rect x="644" y="110" width="40" height="60" fill="#f9e79f" fill-opacity="0.85"/>
    <!-- clearance to shaft for inner 3: small gap -->
    <line x1="530" y1="178" x2="644" y2="178" stroke="#27ae60" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="530" y="200" class="ok">②③④ 近轴间隙 + 腔满脂（不重压）</text>

    <!-- outer lip - only one contacting -->
    <polygon points="700,100 750,100 725,228" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
    <line x1="725" y1="228" x2="725" y2="180" stroke="#c0392b" stroke-width="3"/>
    <text x="690" y="260" class="ok">①最外软唇轻贴</text>

    <!-- purple housing continuing -->
    <rect x="520" y="80" width="250" height="22" fill="#8e44ad" stroke="#5b2c6f"/>

    <!-- callouts for grease -->
    <text x="250" y="290" class="w">浅黄 = 润滑脂（件与件之间的腔都要填）</text>
    <text x="250" y="320" class="t">黄紫迷宫腔满脂 · 红圈之间腔满脂 · 最外唇内侧也满脂</text>
    <text x="250" y="350" class="ok">隔音靠：多级脂腔曲路（你说的对）· 不是靠四道死压轴</text>
  </g>

  <!-- ========== ASSEMBLY SEQUENCE ========== -->
  <g transform="translate(40,490)">
    <rect x="0" y="0" width="1320" height="320" fill="#eaf2f8" stroke="#5dade2" stroke-width="2"/>
    <text x="20" y="36" class="h">装配工艺（轴向压装，能装）</text>

    <!-- step boxes -->
    <g transform="translate(30,60)">
      <rect x="0" y="0" width="230" height="200" fill="#fff" stroke="#bfb6a3"/>
      <text x="12" y="28" class="ok">步骤 A</text>
      <text x="12" y="58" class="t">轴上先装黄封公</text>
      <text x="12" y="85" class="s">（定子，不转）</text>
      <text x="12" y="115" class="t">台阶/沟槽朝外</text>
      <text x="12" y="145" class="t">沟里预涂脂</text>
      <rect x="40" y="160" width="30" height="28" fill="#6b2c1a"/>
      <rect x="70" y="155" width="40" height="25" fill="#f4d03f"/>
    </g>
    <line x1="275" y1="160" x2="310" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>

    <g transform="translate(320,60)">
      <rect x="0" y="0" width="230" height="200" fill="#fff" stroke="#bfb6a3"/>
      <text x="12" y="28" class="ok">步骤 B</text>
      <text x="12" y="58" class="t">轴承+绿座压入管端</text>
      <text x="12" y="85" class="s">（按原工艺）</text>
      <text x="12" y="115" class="t">端面向黄封公</text>
      <text x="12" y="145" class="t">靠拢，留脂腔</text>
      <rect x="40" y="165" width="50" height="22" fill="#145a32"/>
      <rect x="95" y="168" width="30" height="16" fill="#7f8c8d"/>
    </g>
    <line x1="565" y1="160" x2="600" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>

    <g transform="translate(610,60)">
      <rect x="0" y="0" width="230" height="200" fill="#fff" stroke="#bfb6a3"/>
      <text x="12" y="28" class="ok">步骤 C</text>
      <text x="12" y="58" class="t">紫封母轴向套入</text>
      <text x="12" y="85" class="t">齿/腔对准黄台阶</text>
      <text x="12" y="115" class="w">径向有间隙，不卡死</text>
      <text x="12" y="145" class="t">边推边补脂入腔</text>
      <rect x="40" y="165" width="70" height="18" fill="#8e44ad"/>
      <rect x="50" y="183" width="14" height="12" fill="#f9e79f"/>
      <rect x="70" y="183" width="14" height="12" fill="#f9e79f"/>
    </g>
    <line x1="855" y1="160" x2="890" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>

    <g transform="translate(900,60)">
      <rect x="0" y="0" width="380" height="200" fill="#fff" stroke="#bfb6a3"/>
      <text x="12" y="28" class="ok">步骤 D</text>
      <text x="12" y="58" class="t">红密封组件压入紫件槽</text>
      <text x="12" y="88" class="t">· 内三道：近轴间隙环（或轻刮）</text>
      <text x="12" y="118" class="t">· 最外一道：软唇轻贴</text>
      <text x="12" y="148" class="w">每道之间腔注满润滑脂</text>
      <text x="12" y="178" class="ok">转灵活、无啸叫、脂不甩空</text>
    </g>
  </g>

  <!-- bottom principles -->
  <rect x="40" y="840" width="1320" height="180" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="60" y="875" class="h">按你的要求改口后的原则</text>
  <text x="60" y="910" class="t">1. 四道密封之间必须有润滑脂 —— 防尘 + 端部隔音（保留，不取消）。</text>
  <text x="60" y="940" class="t">2. 改进仍是「件与件之间填充润滑脂」：黄紫腔、红圈腔都满脂。</text>
  <text x="60" y="970" class="t">3. 少的是「四道都重压贴轴」，不是少脂；内三道改近间隙/轻刮，最外一道轻贴。</text>
  <text x="60" y="1000" class="ok">4. 结构按轴向套装：黄先上轴 → 座轴承 → 紫套入 → 红组件压入补脂。禁止做成装不进的闭死交错齿。</text>
</svg>
