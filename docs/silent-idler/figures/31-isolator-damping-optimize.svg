<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 26px "WenQuanYi Micro Hei", sans-serif; fill:#1a1a1a; }
      .sub { font: 400 13px "WenQuanYi Micro Hei", sans-serif; fill:#555; }
      .h { font: 700 14px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .t { font: 400 12px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .s { font: 400 11px "WenQuanYi Micro Hei", sans-serif; fill:#666; }
      .ok { font: 700 12px "WenQuanYi Micro Hei", sans-serif; fill:#0a7; }
      .bad { font: 700 11px "WenQuanYi Micro Hei", sans-serif; fill:#b00020; }
      .note { font: 700 12px "WenQuanYi Micro Hei", sans-serif; fill:#1a5276; }
      .box { fill:#faf8f2; stroke:#c8c0b0; }
    ]]></style>
  </defs>
  <rect width="1400" height="900" fill="#f3efe6"/>
  <text x="40" y="38" class="title">轴承隔振套减震优化（已纠正认件）</text>
  <text x="40" y="60" class="sub">第三张不是对开半环，而是整环的周向剖视（断开看截面）</text>

  <text x="40" y="95" class="h">你给的三张图分别是什么</text>

  <!-- A -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="420" height="210" class="box"/>
    <text x="14" y="26" class="h">① 外观整环（光）</text>
    <ellipse cx="110" cy="115" rx="65" ry="26" fill="none" stroke="#1e8449" stroke-width="12"/>
    <ellipse cx="110" cy="98" rx="65" ry="26" fill="#82e0aa" stroke="#1e8449" stroke-width="2"/>
    <ellipse cx="110" cy="98" rx="44" ry="16" fill="#faf8f2"/>
    <text x="200" y="90" class="t">整圈绿环外观</text>
    <text x="200" y="112" class="bad">壁光面</text>
    <text x="200" y="134" class="bad">看不出内筋/防转</text>
    <text x="14" y="190" class="s">ref：光滑绿环孤立图</text>
  </g>

  <!-- B -->
  <g transform="translate(490,110)">
    <rect x="0" y="0" width="420" height="210" class="box"/>
    <text x="14" y="26" class="h">② 端面多孔 + 内台阶</text>
    <ellipse cx="110" cy="115" rx="65" ry="26" fill="none" stroke="#1e8449" stroke-width="12"/>
    <ellipse cx="110" cy="98" rx="65" ry="26" fill="#27ae60" stroke="#145a32" stroke-width="2"/>
    <ellipse cx="110" cy="98" rx="44" ry="16" fill="#faf8f2"/>
    <circle cx="85" cy="88" r="4" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="105" cy="82" r="4" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="125" cy="82" r="4" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="145" cy="88" r="4" fill="#faf8f2" stroke="#145a32"/>
    <text x="200" y="90" class="ok">消声孔思路对</text>
    <text x="200" y="112" class="ok">内台阶可挡轴承</text>
    <text x="200" y="134" class="bad">孔过密易削弱</text>
    <text x="200" y="156" class="bad">内孔仍偏光</text>
    <text x="14" y="190" class="s">ref：端面一圈孔的整环</text>
  </g>

  <!-- C CORRECTED -->
  <g transform="translate(940,110)">
    <rect x="0" y="0" width="420" height="210" class="box"/>
    <text x="14" y="26" class="h">③ 周向剖视（非整环对开）</text>
    <!-- show as cut section of full ring -->
    <path d="M40,140 A80,80 0 0,1 200,140" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="95" y="175" class="s">虚线=未画的另一半环</text>
    <!-- U channel section piece -->
    <path d="M55,130 A70,70 0 0,1 185,130 L175,118 L175,100 L165,100 L165,118 L75,118 L75,100 L65,100 L65,118 Z"
          fill="#27ae60" stroke="#145a32" stroke-width="2"/>
    <circle cx="85" cy="108" r="3" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="105" cy="100" r="3" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="125" cy="96" r="3" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="145" cy="100" r="3" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="165" cy="108" r="3" fill="#faf8f2" stroke="#145a32"/>
    <text x="210" y="80" class="note">纠正：这是断开的</text>
    <text x="210" y="100" class="note">周向剖视图</text>
    <text x="210" y="122" class="ok">用来看截面槽形</text>
    <text x="210" y="144" class="ok">边孔=截面上的孔</text>
    <text x="210" y="166" class="bad">不是装配用半环件</text>
    <text x="14" y="190" class="s">之前误写成「对开半环」已改正</text>
  </g>

  <!-- recommended -->
  <text x="40" y="355" class="h">减震优化（整环一件）</text>
  <g transform="translate(40,370)">
    <rect x="0" y="0" width="1320" height="400" class="box"/>
    <text x="20" y="30" class="h">径向剖视</text>

    <rect x="80" y="55" width="36" height="280" fill="#5dade2" fill-opacity="0.35" stroke="#2e86ab"/>
    <text x="55" y="50" class="s">轴承座</text>

    <path d="M116,75 L200,75 L200,95 L142,95 L142,300 L200,300 L200,320 L116,320 L116,300 L130,300 L130,95 L116,95 Z"
          fill="#1e8449" stroke="#145a32" stroke-width="2"/>
    <circle cx="135" cy="85" r="6" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="160" cy="85" r="6" fill="#faf8f2" stroke="#145a32"/>
    <circle cx="185" cy="85" r="6" fill="#faf8f2" stroke="#145a32"/>
    <text x="220" y="90" class="ok">① 端面少而深盲孔（改你②的过密孔）</text>

    <rect x="104" y="170" width="14" height="40" fill="#145a32"/>
    <text x="220" y="195" class="ok">② 外圆防转凸筋</text>

    <rect x="142" y="115" width="8" height="28" fill="#82e0aa"/>
    <rect x="142" y="160" width="8" height="28" fill="#82e0aa"/>
    <rect x="142" y="205" width="8" height="28" fill="#82e0aa"/>
    <rect x="142" y="250" width="8" height="28" fill="#82e0aa"/>
    <text x="220" y="240" class="ok">③ 内孔减震筋（光面改成筋）</text>

    <rect x="152" y="115" width="36" height="160" fill="#85929e" stroke="#2c3e50"/>
    <circle cx="182" cy="195" r="14" fill="#f7dc6f" stroke="#9a7d0a"/>
    <rect x="172" y="155" width="28" height="80" fill="#aeb6bf" stroke="#2c3e50"/>
    <text x="220" y="285" class="ok">④ 保留内台阶挡外圈</text>
    <text x="220" y="315" class="ok">⑤ PA66+GF · 外圈不碰硬座</text>
    <text x="220" y="345" class="note">⑥ 周向剖视里看到的槽/边孔：改成有序盲孔+筋，仍是整环</text>

    <rect x="720" y="50" width="560" height="300" fill="#eaf2f8" stroke="#a9cce3"/>
    <text x="740" y="85" class="h">认件纠正（重要）</text>
    <text x="740" y="120" class="t">①② = 整环零件的两种显示</text>
    <text x="740" y="148" class="t">③ = 同一类整环的周向剖视</text>
    <text x="740" y="176" class="t">　　用来看壁厚、槽形、边孔</text>
    <text x="740" y="204" class="bad">不是「两半对开装配件」</text>
    <text x="740" y="240" class="t">优化对象：整环隔振套一件</text>
    <text x="740" y="268" class="t">黄封公 / 红唇脂 / 深蓝热补偿不动</text>
    <text x="740" y="310" class="s">此前文档若写「半环对开」一律作废</text>
  </g>
</svg>
