<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #1a2332; }
      .label { font: 600 13px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #243447; }
      .small { font: 400 12px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #4a5a6a; }
      .bg { fill: #f3f6f8; }
      .box { fill: #fff; stroke: #c5d0da; }
      .part { fill: #dfe6ec; stroke: #3d4a57; stroke-width: 1.2; }
      .bearing { fill: #e8c56a; stroke: #8a6a20; }
      .damp { fill: #5a8f6a; stroke: #2f5a3c; }
      .seal { fill: #3d7ea6; stroke: #1f4f6e; }
      .shaft { fill: #5c6770; stroke: #2c343c; }
      .num { font: 700 14px "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; fill: #fff; }
    ]]></style>
  </defs>
  <rect width="1000" height="520" class="bg"/>
  <text x="36" y="40" class="title">图4  装配顺序示意（一端）</text>
  <text x="36" y="62" class="small">压装轴承座 → 装轴承/脂 → 装迷宫密封组件 → 穿轴 → 装阻尼端盖 → 动平衡抽检</text>
  <g transform="translate(40, 200)">
    <circle cx="18" cy="-40" r="14" fill="#c45c26"/><text x="13" y="-35" class="num">1</text>
    <rect x="0" y="0" width="220" height="28" class="shaft" rx="2"/>
    <text x="70" y="55" class="label">轴</text>
  </g>
  <g transform="translate(300, 170)">
    <circle cx="18" cy="-10" r="14" fill="#c45c26"/><text x="13" y="-5" class="num">2</text>
    <circle cx="50" cy="40" r="40" class="bearing"/>
    <circle cx="50" cy="40" r="18" class="shaft"/>
    <text x="20" y="105" class="label">轴承+脂</text>
  </g>
  <g transform="translate(440, 150)">
    <circle cx="18" cy="10" r="14" fill="#c45c26"/><text x="13" y="15" class="num">3</text>
    <rect x="20" y="20" width="90" height="100" class="part"/>
    <circle cx="65" cy="70" r="28" fill="#f3f6f8" stroke="#3d4a57"/>
    <text x="25" y="145" class="label">轴承座</text>
  </g>
  <g transform="translate(570, 165)">
    <circle cx="18" cy="-5" r="14" fill="#c45c26"/><text x="13" y="0" class="num">4</text>
    <rect x="10" y="30" width="70" height="16" class="damp" rx="3"/>
    <rect x="10" y="70" width="70" height="16" class="damp" rx="3"/>
    <text x="5" y="125" class="label">阻尼环</text>
  </g>
  <g transform="translate(680, 155)">
    <circle cx="18" cy="5" r="14" fill="#c45c26"/><text x="13" y="10" class="num">5</text>
    <rect x="20" y="20" width="50" height="100" class="seal" rx="3"/>
    <rect x="28" y="35" width="34" height="6" fill="#1f4f6e"/>
    <rect x="28" y="50" width="34" height="6" fill="#1f4f6e"/>
    <rect x="28" y="65" width="34" height="6" fill="#1f4f6e"/>
    <rect x="28" y="80" width="34" height="6" fill="#1f4f6e"/>
    <rect x="28" y="95" width="34" height="6" fill="#1f4f6e"/>
    <text x="5" y="145" class="label">迷宫组件</text>
  </g>
  <g transform="translate(780, 150)">
    <circle cx="18" cy="10" r="14" fill="#c45c26"/><text x="13" y="15" class="num">6</text>
    <path d="M30 20 L70 20 L70 120 L30 120 Q10 70 30 20 Z" class="damp"/>
    <text x="20" y="145" class="label">端盖</text>
  </g>
  <g transform="translate(40, 320)">
    <circle cx="18" cy="-20" r="14" fill="#c45c26"/><text x="13" y="-15" class="num">7</text>
    <rect x="0" y="0" width="700" height="50" class="part" rx="4"/>
    <text x="300" y="32" class="label">辊筒（两端压入轴承座组件）</text>
  </g>
  <rect x="40" y="420" width="920" height="70" class="box" rx="6"/>
  <text x="60" y="448" class="label">工艺要点</text>
  <text x="60" y="470" class="small">轴承座与筒体过盈压装后环焊（或高分子筒热装）；密封组件轴向定位可靠；两端端盖对称；整辊动平衡；旋转阻力与噪声台架抽检。</text>
</svg>
