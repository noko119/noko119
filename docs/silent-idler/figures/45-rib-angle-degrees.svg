<text x="362" y="485" class="s">外圈</text>
<line x1="380" y1="480" x2="474.5" y2="470.1" stroke="#c0392b" stroke-width="1.5"/>
<line x1="380" y1="480" x2="474.5" y2="489.9" stroke="#c0392b" stroke-width="1.5"/>
<text x="535.0" y="480.0" class="deg">每条筋 ≈ 12°</text>
<text x="534.8" y="556.5" class="ok">均布间隔 45°</text>
<circle cx="548.0" cy="480.0" r="3" fill="#f4d03f"/>
<circle cx="498.8" cy="598.8" r="3" fill="#f4d03f"/>
<circle cx="380.0" cy="648.0" r="3" fill="#f4d03f"/>
<circle cx="261.2" cy="598.8" r="3" fill="#f4d03f"/>
<circle cx="212.0" cy="480.0" r="3" fill="#f4d03f"/>
<circle cx="261.2" cy="361.2" r="3" fill="#f4d03f"/>
<circle cx="380.0" cy="312.0" r="3" fill="#f4d03f"/>
<circle cx="498.8" cy="361.2" r="3" fill="#f4d03f"/>
<text x="455.7" y="521.7" class="w">筋间空</text>
<text x="450.7" y="539.7" class="w">≈ 33°</text>
<text x="60" y="820" class="t">黄点 = 8 条筋中心，每隔 45°</text>
<text x="60" y="850" class="t">红线夹角 = 单条筋接触宽度 ≈ 12°</text>
<rect x="780" y="90" width="680" height="780" fill="#eaf2f8" stroke="#5dade2" stroke-width="2"/>
<text x="800" y="130" class="h">听清的问题</text>
<text x="800" y="165" class="t">减震座与轴承外圈接触的凸起</text>
<text x="800" y="195" class="t">（减震筋）—— 每条占多少度？</text>
<text x="800" y="250" class="h">推荐（Φ159 / 8 筋）</text>
<text x="800" y="290" class="ok">筋条数 N = 8</text>
<text x="800" y="325" class="ok">均布间隔 = 360°/8 = 45°</text>
<text x="800" y="360" class="ok">每条筋宽度 α ≈ 10°～14°</text>
<text x="800" y="395" class="ok">推荐取 α = 12°</text>
<text x="800" y="430" class="w">筋间空腔 β ≈ 45°−12° = 33°</text>
<text x="800" y="490" class="h">若用 6 条</text>
<text x="800" y="525" class="t">间隔 = 60°</text>
<text x="800" y="555" class="t">每条筋宽仍 ≈ 12°～15°</text>
<text x="800" y="585" class="t">空腔更大，隔振略软</text>
<text x="800" y="645" class="h">别搞错</text>
<text x="800" y="680" class="t">· 度数指周向圆心角，不是筋高</text>
<text x="800" y="710" class="t">· 筋顶圆才碰外圈；筋根不碰</text>
<text x="800" y="740" class="t">· 8 条×12°：总接触约 96°</text>
<text x="800" y="770" class="t">　（圆周 1/4 多一点），其余空腔吸振</text>
<text x="800" y="820" class="ok">能听清：凸起接触外圈，按度均布。</text>
</svg>