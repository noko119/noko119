<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 30px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .sub { font: 400 15px "WenQuanYi Micro Hei", sans-serif; fill:#444; }
      .h { font: 700 18px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .t { font: 400 15px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .b { font: 700 15px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .ok { font: 700 15px "WenQuanYi Micro Hei", sans-serif; fill:#0a7; }
      .bad { font: 700 15px "WenQuanYi Micro Hei", sans-serif; fill:#b00020; }
      .s { font: 400 13px "WenQuanYi Micro Hei", sans-serif; fill:#555; }
      .box { fill:#fffdf8; stroke:#bfb6a3; stroke-width:1.5; }
      .step { fill:#eef8f1; stroke:#8bc6a3; }
    ]]></style>
  </defs>
  <rect width="1400" height="980" fill="#f2eee4"/>
  <text x="40" y="45" class="title">减震座怎么改才更静 —— 一句话说清</text>
  <text x="40" y="75" class="sub">绿色减震座夹在：轴承外圈（里）和轴承座硬孔（外）之间。目标：外圈振动少传到轴承座。</text>

  <rect x="40" y="95" width="1320" height="70" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="60" y="140" class="h">一句话：别让轴承外圈硬碰轴承座；中间绿套用「筋」抱住外圈，再防转、开盲孔吸声。</text>

  <text x="40" y="210" class="h">1. 它装在哪</text>
  <g transform="translate(40,225)">
    <rect x="0" y="0" width="1320" height="200" class="box"/>
    <rect x="80" y="40" width="200" height="120" fill="#5dade2" stroke="#2e86ab" stroke-width="2"/>
    <text x="115" y="110" class="b" fill="#1a5276">轴承座（硬）</text>
    <rect x="300" y="55" width="120" height="90" fill="#1e8449" stroke="#145a32" stroke-width="2"/>
    <text x="320" y="110" class="b" fill="#fff">绿减震座</text>
    <rect x="440" y="70" width="90" height="60" fill="#85929e" stroke="#2c3e50" stroke-width="2"/>
    <text x="455" y="108" class="b">外圈</text>
    <circle cx="580" cy="100" r="28" fill="#f7dc6f" stroke="#9a7d0a" stroke-width="2"/>
    <text x="555" y="160" class="s">滚动体</text>
    <rect x="640" y="70" width="70" height="60" fill="#aeb6bf" stroke="#2c3e50" stroke-width="2"/>
    <text x="652" y="108" class="b">内圈</text>
    <rect x="730" y="55" width="160" height="90" fill="#6b2c1a" stroke="#4a1a0e" stroke-width="2"/>
    <text x="760" y="110" class="b" fill="#fff">轴（固定）</text>
    <text x="80" y="185" class="t">从外到里：轴承座 → 【绿减震座】 → 轴承外圈 → 滚动体 → 内圈 → 轴</text>
    <text x="1000" y="90" class="bad">振动往外传</text>
    <line x1="520" y1="45" x2="360" y2="45" stroke="#b00020" stroke-width="3"/>
    <polygon points="360,45 375,38 375,52" fill="#b00020"/>
  </g>

  <text x="40" y="465" class="h">2. 绿件上只改三处</text>

  <g transform="translate(40,480)">
    <rect x="0" y="0" width="420" height="280" class="step"/>
    <text x="16" y="36" class="h">改① 内孔</text>
    <text x="16" y="65" class="bad">现在：光面硬抱外圈</text>
    <circle cx="100" cy="140" r="55" fill="none" stroke="#1e8449" stroke-width="16"/>
    <circle cx="100" cy="140" r="38" fill="#85929e"/>
    <text x="78" y="145" class="s" fill="#fff">外圈</text>
    <text x="180" y="120" class="bad">面接触</text>
    <text x="180" y="145" class="bad">振动传得快</text>
    <text x="16" y="220" class="ok">改成：内孔加一圈减震筋</text>
    <text x="16" y="248" class="ok">只筋顶贴外圈，吸掉高频</text>
    <text x="16" y="272" class="s">建议 6～8 条筋</text>
  </g>

  <g transform="translate(490,480)">
    <rect x="0" y="0" width="420" height="280" class="step"/>
    <text x="16" y="36" class="h">改② 外圆</text>
    <text x="16" y="65" class="bad">现在：外圆光滑</text>
    <circle cx="100" cy="140" r="55" fill="#82e0aa" stroke="#1e8449" stroke-width="2"/>
    <text x="180" y="120" class="bad">可能在座孔里微转</text>
    <text x="180" y="145" class="bad">打滑会啸叫</text>
    <text x="16" y="220" class="ok">改成：外圆加 3 条防转凸筋</text>
    <text x="16" y="248" class="ok">座孔开槽，锁死不转</text>
    <text x="16" y="272" class="s">凸筋均布 120°</text>
  </g>

  <g transform="translate(940,480)">
    <rect x="0" y="0" width="420" height="280" class="step"/>
    <text x="16" y="36" class="h">改③ 端面孔</text>
    <text x="16" y="65" class="bad">现在：很小很密的孔</text>
    <circle cx="70" cy="120" r="3" fill="#999"/><circle cx="85" cy="115" r="3" fill="#999"/>
    <circle cx="100" cy="112" r="3" fill="#999"/><circle cx="115" cy="115" r="3" fill="#999"/>
    <circle cx="130" cy="120" r="3" fill="#999"/><circle cx="90" cy="140" r="3" fill="#999"/>
    <text x="160" y="130" class="bad">壁被挖虚、易裂</text>
    <text x="16" y="220" class="ok">改成：8～12 个更深的盲孔</text>
    <text x="16" y="248" class="ok">少而深 = 更好消声腔</text>
    <text x="16" y="272" class="s">内台阶保留</text>
  </g>

  <rect x="40" y="790" width="1320" height="150" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="60" y="830" class="h">3. 改完怎么算成功</text>
  <text x="60" y="865" class="t">外圈只能碰到绿筋，不能碰到轴承座硬孔。手转灵活、无周期性吱声。</text>
  <text x="60" y="895" class="t">材料：PA66+GF。黄封公、红唇、深蓝热补偿这次先不动。</text>
</svg>
