<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 28px "WenQuanYi Micro Hei", sans-serif; fill:#1a1a1a; }
      .sub { font: 400 14px "WenQuanYi Micro Hei", sans-serif; fill:#444; }
      .h { font: 700 15px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .t { font: 400 13px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .s { font: 400 12px "WenQuanYi Micro Hei", sans-serif; fill:#555; }
      .ok { font: 700 13px "WenQuanYi Micro Hei", sans-serif; fill:#0a7; }
      .w { font: 700 12px "WenQuanYi Micro Hei", sans-serif; fill:#a60; }
      .box { fill:#faf8f2; stroke:#c8c0b0; stroke-width:1; }
    ]]></style>
  </defs>
  <rect width="1400" height="780" fill="#f3efe6"/>
  <text x="40" y="42" class="title">静音轴承座 — 完整轴承半剖示意</text>
  <text x="40" y="68" class="sub">轴贯通 · 轴承画全（内圈/滚动体/外圈）· 颜色与 CAD 对应 · 层次不叠乱</text>

  <!-- ========== MAIN SECTION ========== -->
  <g transform="translate(40,90)">
    <rect x="0" y="0" width="900" height="520" class="box"/>

    <!-- centerline -->
    <line x1="30" y1="260" x2="870" y2="260" stroke="#999" stroke-dasharray="6 4" stroke-width="1"/>
    <text x="820" y="252" class="s">中心线</text>

    <!-- continuous shaft (full width, thick) -->
    <rect x="40" y="230" width="820" height="60" fill="#6b2c1a" stroke="#4a1a0e" stroke-width="1"/>
    <text x="50" y="266" class="t" fill="#fff">实心轴（贯通·固定不转）</text>
    <!-- flat on left -->
    <rect x="40" y="230" width="50" height="14" fill="#4a1a0e"/>
    <text x="45" y="222" class="s">扁位</text>

    <!-- === Seal zone left === -->
    <!-- purple rotor / 封母 -->
    <path d="M120,140 L280,140 L280,180 L250,180 L250,200 L280,200 L280,320 L250,320 L250,340 L280,340 L280,380 L120,380 L120,340 L150,340 L150,180 L120,180 Z"
          fill="#7d3c98" fill-opacity="0.85" stroke="#5b2c6f" stroke-width="1.5"/>
    <text x="130" y="165" class="t" fill="#fff">紫·封母/转子</text>
    <text x="130" y="370" class="s" fill="#fff">随辊转</text>

    <!-- golden yellow stator / 封公 on shaft -->
    <path d="M160,200 L320,200 L320,230 L180,230 L180,290 L320,290 L320,320 L160,320 Z"
          fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
    <!-- yellow vertical flange toward bearing -->
    <rect x="300" y="200" width="28" height="120" fill="#f4d03f" stroke="#b7950b" stroke-width="1.5"/>
    <text x="168" y="255" class="h">金黄·封公/定子</text>
    <text x="168" y="275" class="s">装轴上·不转</text>

    <!-- red soft lips (one row, clear) -->
    <path d="M200,205 Q210,218 200,225" fill="none" stroke="#c0392b" stroke-width="3.5"/>
    <path d="M230,205 Q240,218 230,225" fill="none" stroke="#c0392b" stroke-width="3.5"/>
    <path d="M260,205 Q270,218 260,225" fill="none" stroke="#c0392b" stroke-width="3.5"/>
    <path d="M200,315 Q210,302 200,295" fill="none" stroke="#c0392b" stroke-width="3.5"/>
    <path d="M230,315 Q240,302 230,295" fill="none" stroke="#c0392b" stroke-width="3.5"/>
    <path d="M260,315 Q270,302 260,295" fill="none" stroke="#c0392b" stroke-width="3.5"/>
    <!-- grease dots -->
    <circle cx="215" cy="240" r="3" fill="#f9e79f" stroke="#b7950b"/>
    <circle cx="245" cy="245" r="3" fill="#f9e79f" stroke="#b7950b"/>
    <circle cx="275" cy="240" r="3" fill="#f9e79f" stroke="#b7950b"/>
    <circle cx="215" cy="280" r="3" fill="#f9e79f" stroke="#b7950b"/>
    <circle cx="245" cy="275" r="3" fill="#f9e79f" stroke="#b7950b"/>
    <text x="200" y="130" class="t">红软唇 + 脂（浅黄点）</text>

    <!-- === COMPLETE BEARING === -->
    <!-- outer race -->
    <rect x="360" y="165" width="55" height="190" rx="2" fill="#85929e" stroke="#2c3e50" stroke-width="2"/>
    <!-- raceway notch visual on outer -->
    <rect x="368" y="200" width="12" height="120" fill="#5d6d7e"/>
    <!-- inner race -->
    <rect x="400" y="210" width="40" height="100" rx="2" fill="#aeb6bf" stroke="#2c3e50" stroke-width="2"/>
    <rect x="405" y="225" width="12" height="70" fill="#7f8c8d"/>
    <!-- ball (complete circle in section) -->
    <circle cx="392" cy="260" r="22" fill="#f7dc6f" stroke="#9a7d0a" stroke-width="2"/>
    <circle cx="392" cy="260" r="8" fill="#f9e79f"/>
    <!-- labels for bearing parts -->
    <line x1="415" y1="165" x2="455" y2="130" stroke="#2c3e50" stroke-width="1"/>
    <text x="458" y="128" class="h">外圈</text>
    <line x1="420" y1="260" x2="470" y2="260" stroke="#2c3e50" stroke-width="1"/>
    <text x="473" y="264" class="h">内圈</text>
    <line x1="392" y1="238" x2="392" y2="100" stroke="#9a7d0a" stroke-width="1"/>
    <text x="370" y="95" class="h">滚动体</text>
    <text x="355" y="380" class="h">深沟球轴承（画全）</text>

    <!-- green muffler around OUTER race only -->
    <path d="M340,150 L430,150 L430,165 L355,165 L355,355 L430,355 L430,370 L340,370 Z"
          fill="#27ae60" fill-opacity="0.9" stroke="#145a32" stroke-width="2"/>
    <!-- damping ribs touching outer race -->
    <rect x="348" y="175" width="8" height="30" fill="#1e8449"/>
    <rect x="348" y="220" width="8" height="30" fill="#1e8449"/>
    <rect x="348" y="265" width="8" height="30" fill="#1e8449"/>
    <rect x="348" y="310" width="8" height="30" fill="#1e8449"/>
    <!-- anti-rot lug -->
    <rect x="330" y="240" width="12" height="40" fill="#196f3d"/>
    <text x="250" y="145" class="ok">绿·隔音套（包外圈）</text>
    <text x="250" y="400" class="s">减震筋 · 防转 · 外圈不碰硬座</text>

    <!-- gap note: outer race not touching teal -->
    <text x="440" y="175" class="ok">← 外圈只进绿套</text>

    <!-- dark blue thermal soft (right of bearing, clear block) -->
    <path d="M450,200 L500,200 L510,230 L510,290 L500,320 L450,320 Z"
          fill="#1a5276" stroke="#0b2942" stroke-width="1.5"/>
    <text x="455" y="255" class="t" fill="#fff">深蓝</text>
    <text x="455" y="275" class="s" fill="#cfd8dc">热补偿</text>

    <!-- teal housing (outer, simplified U away from outer race) -->
    <path d="M310,120 L560,120 L560,400 L310,400 L310,380 L540,380 L540,140 L310,140 Z"
          fill="#5dade2" fill-opacity="0.22" stroke="#2e86ab" stroke-width="1.5"/>
    <text x="520" y="160" class="t">青绿端座</text>

    <!-- optional thin isolation dashed between shaft and inner race -->
    <rect x="398" y="228" width="3" height="64" fill="#e67e22" fill-opacity="0.8"/>
    <text x="520" y="300" class="w">橙虚线=可选内圈—轴薄衬套（次要）</text>

    <text x="40" y="480" class="ok">轴连续贯通，轴承内圈/滚动体/外圈画全；密封在左，绿套包外圈，深蓝在轴承内侧热补偿</text>
  </g>

  <!-- ========== RIGHT LEGEND ========== -->
  <g transform="translate(970,90)">
    <rect x="0" y="0" width="390" height="520" class="box"/>
    <text x="20" y="36" class="h">认件（从上到下别混）</text>

    <rect x="20" y="55" width="28" height="18" fill="#6b2c1a"/>
    <text x="58" y="69" class="t">棕 · 实心轴（贯通不转）</text>

    <rect x="20" y="90" width="28" height="18" fill="#f1c40f" stroke="#b7950b"/>
    <text x="58" y="104" class="t">金黄 · 封公/迷宫定子</text>
    <text x="58" y="122" class="s">装轴上，固定不转</text>

    <rect x="20" y="140" width="28" height="18" fill="#7d3c98"/>
    <text x="58" y="154" class="t">紫 · 封母/迷宫转子</text>
    <text x="58" y="172" class="s">随辊转</text>

    <path d="M22,195 Q32,205 22,212" fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="58" y="210" class="t">红 · 软唇</text>
    <circle cx="34" cy="230" r="3" fill="#f9e79f" stroke="#b7950b"/>
    <text x="58" y="234" class="t">浅黄点 · 润滑脂</text>

    <rect x="20" y="255" width="28" height="18" fill="#85929e" stroke="#2c3e50"/>
    <text x="58" y="269" class="t">灰 · 轴承外圈</text>
    <circle cx="34" cy="295" r="8" fill="#f7dc6f" stroke="#9a7d0a"/>
    <text x="58" y="300" class="t">金圆 · 滚动体</text>
    <rect x="20" y="318" width="28" height="18" fill="#aeb6bf" stroke="#2c3e50"/>
    <text x="58" y="332" class="t">浅灰 · 轴承内圈</text>

    <rect x="20" y="355" width="28" height="18" fill="#27ae60"/>
    <text x="58" y="369" class="t">绿 · 隔音套（包外圈）</text>
    <text x="58" y="387" class="s">主静音：外圈不碰硬座</text>

    <rect x="20" y="405" width="28" height="18" fill="#1a5276"/>
    <text x="58" y="419" class="t">深蓝 · 热变形补偿</text>

    <rect x="20" y="440" width="28" height="18" fill="#5dade2" fill-opacity="0.4" stroke="#2e86ab"/>
    <text x="58" y="454" class="t">青绿 · 端座壳体</text>

    <rect x="20" y="475" width="28" height="18" fill="#e67e22"/>
    <text x="58" y="489" class="t">橙 · 可选内圈—轴衬套</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="640" width="1320" height="110" fill="#e8f6f3" stroke="#a8d5c5"/>
  <text x="60" y="675" class="h">读图顺序（从左到右）</text>
  <text x="60" y="702" class="t">扁位轴端 → 紫封母 + 金黄封公 + 红唇满脂 → 【完整轴承：外圈|滚动体|内圈】外包绿隔音套 → 深蓝热补偿 → 青绿端座</text>
  <text x="60" y="728" class="t">主静音看绿套包外圈；内圈—轴隔离只是可选橙层；轴始终一根贯通。</text>
</svg>
