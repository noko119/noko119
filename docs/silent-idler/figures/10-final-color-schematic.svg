<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <pattern id="tubeHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7a8690" stroke-width="1.2"/>
    </pattern>
    <pattern id="nylonDot" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#5a9bb8"/>
    </pattern>
    <pattern id="greaseDot" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#e6c84a"/>
    </pattern>
    <style>
      .T { font: 700 20px "WenQuanYi Micro Hei","Noto Sans CJK SC",sans-serif; fill:#1a2332; }
      .b { font: 600 13px "WenQuanYi Micro Hei","Noto Sans CJK SC",sans-serif; fill:#1a2332; }
      .t { font: 400 12px "WenQuanYi Micro Hei","Noto Sans CJK SC",sans-serif; fill:#334; }
      .s { font: 400 11px "WenQuanYi Micro Hei","Noto Sans CJK SC",sans-serif; fill:#556; }
      .ok { font: 600 12px "WenQuanYi Micro Hei","Noto Sans CJK SC",sans-serif; fill:#1a6b35; }
      .warn { font: 600 11px "WenQuanYi Micro Hei","Noto Sans CJK SC",sans-serif; fill:#a33; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f7f8fa"/>
  <text x="36" y="40" class="T">静音托辊端部结构示意（冲压座 + 尼龙降噪座）完善版</text>
  <text x="36" y="62" class="s">示意图，非比例　风格对齐成熟教材图　已纠正迷宫动静标注</text>

  <!-- main drawing area background -->
  <rect x="30" y="80" width="720" height="380" fill="#fff" stroke="#d0d5da" rx="4"/>

  <!-- centerline -->
  <line x1="50" y1="400" x2="720" y2="400" stroke="#c45c26" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="60" y="418" class="s">回转轴线</text>

  <!-- 2 tube upper -->
  <rect x="80" y="120" width="520" height="48" fill="#c5ced6" stroke="#4a5560" stroke-width="1.4"/>
  <rect x="80" y="120" width="520" height="48" fill="url(#tubeHatch)" opacity="0.45"/>
  <text x="280" y="110" class="b">② 管体（精密高频焊管）</text>
  <text x="70" y="145" class="s">辊中部 ←</text>
  <text x="560" y="145" class="s">→ 辊外侧</text>

  <!-- 3 stamped housing purple -->
  <path d="M200 168 L380 168 L380 250 L220 250 L220 320 L200 320 Z"
        fill="#9b7bb8" stroke="#5a3d78" stroke-width="1.5"/>
  <!-- anti-rotation slot -->
  <rect x="212" y="250" width="14" height="28" fill="#7d5f9a" stroke="#5a3d78"/>
  <!-- weld -->
  <path d="M200 168 L190 155" stroke="#4a5560" stroke-width="2.2"/>
  <path d="M205 168 L198 152" stroke="#4a5560" stroke-width="1.5"/>
  <text x="160" y="150" class="s">气体保护焊</text>
  <text x="230" y="195" class="b" fill="#fff">③ 冲压轴承座</text>

  <!-- 4 nylon seat light blue with dots -->
  <path d="M225 175 L365 175 L365 200 L350 200 L350 285 L240 285 L240 255 L225 255 Z"
        fill="#b8d9e8" stroke="#3a7a96" stroke-width="1.5"/>
  <path d="M225 175 L365 175 L365 200 L350 200 L350 285 L240 285 L240 255 L225 255 Z"
        fill="url(#nylonDot)" opacity="0.35"/>
  <!-- flange -->
  <rect x="215" y="168" width="18" height="14" fill="#a8cde0" stroke="#3a7a96"/>
  <text x="195" y="165" class="s">翻边</text>
  <!-- anti-rotation rib into slot -->
  <rect x="214" y="255" width="12" height="22" fill="#8fc0d6" stroke="#3a7a96"/>
  <text x="140" y="275" class="s">防转凸筋</text>
  <!-- damping ribs in bore -->
  <rect x="250" y="210" width="3" height="55" fill="#5a9bb8"/>
  <rect x="258" y="210" width="2.5" height="55" fill="#5a9bb8" opacity="0.7"/>
  <text x="265" y="205" class="s">减震筋</text>
  <text x="270" y="245" class="b" fill="#2a5a70">④ 尼龙降噪座 PA66</text>

  <!-- 5 bearing -->
  <circle cx="300" cy="320" r="55" fill="#4a5560" stroke="#222" stroke-width="1.5"/>
  <circle cx="300" cy="320" r="28" fill="#8a9299" stroke="#222"/>
  <circle cx="300" cy="320" r="42" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="300" cy="278" r="7" fill="#2a2a2a" stroke="#111"/>
  <circle cx="300" cy="362" r="7" fill="#2a2a2a" stroke="#111"/>
  <circle cx="258" cy="320" r="7" fill="#2a2a2a" stroke="#111"/>
  <circle cx="342" cy="320" r="7" fill="#2a2a2a" stroke="#111"/>
  <!-- clip bearing to half above axis roughly by covering below - actually show full bearing ok in half section style of ref -->
  <text x="285" y="325" class="b" fill="#fff">⑤</text>

  <!-- grease -->
  <ellipse cx="300" cy="200" rx="55" ry="18" fill="url(#greaseDot)" opacity="0.7"/>
  <text x="330" y="185" class="s">⑧ 润滑脂</text>

  <!-- 6 labyrinth CORRECTED: dark=stator on shaft (fixed), light=rotor with housing (rotates) -->
  <!-- outer rotor (light purple) - with housing/end -->
  <path d="M380 200 L470 200 L470 250 L455 250 L455 290 L390 290 L390 250 L380 250 Z"
        fill="#c4b0d8" stroke="#6a5080" stroke-width="1.3"/>
  <!-- rotor teeth -->
  <rect x="400" y="210" width="8" height="35" fill="#b39bc8" stroke="#6a5080"/>
  <rect x="420" y="210" width="8" height="35" fill="#b39bc8" stroke="#6a5080"/>
  <rect x="440" y="210" width="8" height="35" fill="#b39bc8" stroke="#6a5080"/>
  <!-- stator on shaft (dark purple) FIXED -->
  <rect x="390" y="290" width="70" height="18" fill="#6b4a85" stroke="#3d2855"/>
  <rect x="395" y="255" width="8" height="40" fill="#6b4a85" stroke="#3d2855"/>
  <rect x="415" y="255" width="8" height="40" fill="#6b4a85" stroke="#3d2855"/>
  <rect x="435" y="255" width="8" height="40" fill="#6b4a85" stroke="#3d2855"/>
  <rect x="455" y="270" width="8" height="25" fill="#6b4a85" stroke="#3d2855"/>
  <text x="480" y="230" class="b" fill="#6a5080">⑥ 迷宫外圈(转子)</text>
  <text x="480" y="248" class="ok">随座/管转动</text>
  <text x="480" y="290" class="b" fill="#3d2855">⑥ 迷宫内圈(定子)</text>
  <text x="480" y="308" class="ok">随轴固定·不转</text>
  <text x="480" y="326" class="warn">※已纠正：轴固定时轴上件不转</text>

  <!-- 7 circlip -->
  <rect x="470" y="308" width="8" height="14" fill="#3d5a80" stroke="#1a2a40"/>
  <text x="485" y="350" class="s">⑦ 挡圈</text>

  <!-- 1 shaft -->
  <rect x="80" y="380" width="560" height="40" fill="#9aa3ab" stroke="#4a5560" stroke-width="1.4" rx="2"/>
  <rect x="600" y="372" width="40" height="56" fill="#8a9299" stroke="#4a5560"/>
  <text x="200" y="405" class="b">① 轴（钢·固定不转）</text>

  <!-- fit labels A B C -->
  <circle cx="235" cy="230" r="10" fill="#fff" stroke="#c45c26" stroke-width="1.5"/>
  <text x="231" y="234" class="b" fill="#c45c26">A</text>
  <circle cx="270" cy="250" r="10" fill="#fff" stroke="#c45c26" stroke-width="1.5"/>
  <text x="266" y="254" class="b" fill="#c45c26">B</text>
  <circle cx="300" cy="365" r="10" fill="#fff" stroke="#c45c26" stroke-width="1.5"/>
  <text x="296" y="369" class="b" fill="#c45c26">C</text>

  <!-- RIGHT parts table -->
  <g transform="translate(770, 80)">
    <rect width="400" height="360" fill="#fff" stroke="#d0d5da" rx="4"/>
    <text x="16" y="28" class="b">零件表</text>
    <!-- rows -->

    <rect x="16" y="45" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="63" r="12" fill="#9aa3ab" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="67" class="b" fill="#fff">1</text>
    <text x="56" y="60" class="b">轴</text>
    <text x="56" y="75" class="s">钢；固定不转，端头入支架槽口</text>

    <rect x="16" y="83" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="101" r="12" fill="#c5ced6" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="105" class="b" fill="#fff">2</text>
    <text x="56" y="98" class="b">管体</text>
    <text x="56" y="113" class="s">精密高频焊管</text>

    <rect x="16" y="121" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="139" r="12" fill="#9b7bb8" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="143" class="b" fill="#fff">3</text>
    <text x="56" y="136" class="b">冲压轴承座</text>
    <text x="56" y="151" class="s">钢板冲压，与管体内壁焊接</text>

    <rect x="16" y="159" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="177" r="12" fill="#b8d9e8" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="181" class="b" fill="#fff">4</text>
    <text x="56" y="174" class="b">尼龙降噪座</text>
    <text x="56" y="189" class="s">PA66；翻边+防转凸筋+内孔减震筋</text>

    <rect x="16" y="197" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="215" r="12" fill="#4a5560" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="219" class="b" fill="#fff">5</text>
    <text x="56" y="212" class="b">深沟球轴承</text>
    <text x="56" y="227" class="s">压入尼龙座；建议 Z2/Z3、C3</text>

    <rect x="16" y="235" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="253" r="12" fill="#6b4a85" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="257" class="b" fill="#fff">6</text>
    <text x="56" y="250" class="b">迷宫密封</text>
    <text x="56" y="265" class="s">定子随轴固定；转子随座转动</text>

    <rect x="16" y="273" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="291" r="12" fill="#3d5a80" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="295" class="b" fill="#fff">7</text>
    <text x="56" y="288" class="b">挡圈</text>
    <text x="56" y="303" class="s">轴用挡圈，轴向锁定</text>

    <rect x="16" y="311" width="368" height="36" fill="#f7f8fa" stroke="#e0e5ea"/>
    <circle cx="36" cy="329" r="12" fill="#e6c84a" stroke="#333" stroke-width="0.8"/>
    <text x="32" y="333" class="b" fill="#fff">8</text>
    <text x="56" y="326" class="b">润滑脂</text>
    <text x="56" y="341" class="s">轴承腔与迷宫间隙充填</text>

  </g>

  <!-- bottom fit + vibration -->
  <g transform="translate(30, 480)">
    <rect width="1140" height="190" fill="#fff" stroke="#d0d5da" rx="4"/>
    <text x="16" y="28" class="b">配合说明</text>
    <text x="16" y="52" class="t">A　冲压座孔 / 尼龙座外圆：过盈配合 + 防转凸筋/卡槽</text>
    <text x="16" y="74" class="t">B　尼龙座内孔 / 轴承外圈：减震筋过盈（轴承外圈不与钢座直接接触）</text>
    <text x="16" y="96" class="t">C　轴 / 轴承内圈：按设计配合</text>

    <text x="16" y="130" class="b">振动传递路径</text>
    <!-- flow boxes -->
    <rect x="16" y="145" width="120" height="32" rx="4" fill="#f7e4d8" stroke="#c45c26"/>
    <text x="28" y="166" class="t">1 轴承振动</text>
    <text x="142" y="166" class="b" fill="#c45c26">→</text>
    <rect x="160" y="145" width="150" height="32" rx="4" fill="#d4eef8" stroke="#3a7a96"/>
    <text x="172" y="166" class="t">2 尼龙座（阻尼）</text>
    <text x="316" y="166" class="b" fill="#c45c26">→</text>
    <rect x="334" y="145" width="120" height="32" rx="4" fill="#e8dff2" stroke="#5a3d78"/>
    <text x="348" y="166" class="t">3 冲压座</text>
    <text x="460" y="166" class="b" fill="#c45c26">→</text>
    <rect x="478" y="145" width="120" height="32" rx="4" fill="#e0e5ea" stroke="#4a5560"/>
    <text x="500" y="166" class="t">4 管体辐射</text>
    <text x="620" y="166" class="ok">尼龙座切断钢-钢硬传，抑管体鼓振</text>
  </g>
</svg>
