<line x1="1080" y1="350" x2="1140" y2="350" stroke="#8e44ad" stroke-width="5"/>
<text x="1155" y="355" class="leg">顶中梁 □80×80×3</text>
<line x1="1080" y1="390" x2="1140" y2="390" stroke="#27ae60" stroke-width="3"/>
<text x="1155" y="395" class="leg">顶檩 □60×60×3</text>
<text x="1080" y="450" class="h">装配顺序</text>
<text x="1080" y="485" class="t">1. 隔振垫 + 浮筑地</text>
<text x="1080" y="515" class="t">2. 地梁交圈</text>
<text x="1080" y="545" class="t">3. 立柱竖起</text>
<text x="1080" y="575" class="t">4. 上圈梁交圈</text>
<text x="1080" y="605" class="t">5. 顶中梁 + 顶檩</text>
<text x="1080" y="635" class="t">6. 挂隔音板 + 密封</text>
<text x="1080" y="665" class="t">7. 铺顶板、装门窗</text>
<text x="1080" y="720" class="ok">柱距 ≈ 1 m</text>
<text x="1080" y="750" class="s">板后挂，图为骨架</text>
<text x="1080" y="780" class="s">电机另做小框架隔间</text>
<rect x="40" y="830" width="1420" height="230" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
<text x="60" y="870" class="h">读图要点</text>
<text x="60" y="910" class="t">· 蓝底一圈 = 地梁；灰柱竖立；橙顶一圈 = 上横梁（圈梁）。</text>
<text x="60" y="945" class="t">· 紫线 = 屋顶纵向中梁，把 4 m 向分成两跨，顶檩 □60×60×3 才压得住。</text>
<text x="60" y="980" class="t">· 红虚线处 = 声闸门洞；门柱加粗，门上沿圈梁/过梁加强。</text>
<text x="60" y="1015" class="ok">· 隔音板卡在柱间、顶到圈梁；本图只画钢架，板未画出。</text>
