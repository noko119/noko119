<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: 700 26px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .sub { font: 400 14px "WenQuanYi Micro Hei", sans-serif; fill:#444; }
      .h { font: 700 16px "WenQuanYi Micro Hei", sans-serif; fill:#111; }
      .t { font: 400 14px "WenQuanYi Micro Hei", sans-serif; fill:#222; }
      .ok { font: 700 14px "WenQuanYi Micro Hei", sans-serif; fill:#0a7; }
      .w { font: 700 13px "WenQuanYi Micro Hei", sans-serif; fill:#a60; }
      .s { font: 400 12px "WenQuanYi Micro Hei", sans-serif; fill:#555; }
      .box { fill:#fffdf8; stroke:#bfb6a3; }
    ]]></style>
  </defs>
  <rect width="1400" height="860" fill="#f2eee4"/>
  <text x="40" y="40" class="title">方管框架 · 单层板 vs 双 70 板</text>
  <text x="40" y="68" class="sub">原来给你的那一套方管架 = 单层板方案；现在只有 70 板 → 变成「外架 + 内架」两套同样思路的方管</text>

  <!-- LEFT: original single frame -->
  <g transform="translate(40,95)">
    <rect x="0" y="0" width="640" height="520" class="box"/>
    <text x="16" y="32" class="h">原来：一套方管框架</text>
    <text x="16" y="60" class="s">（配单层 150 板时）</text>

    <!-- simple frame box -->
    <rect x="120" y="120" width="360" height="280" fill="none" stroke="#f39c12" stroke-width="10"/>
    <rect x="120" y="380" width="40" height="40" fill="#5d6d7e"/>
    <rect x="440" y="380" width="40" height="40" fill="#5d6d7e"/>
    <rect x="120" y="120" width="40" height="40" fill="#5d6d7e"/>
    <rect x="440" y="120" width="40" height="40" fill="#5d6d7e"/>
    <!-- panel on outside -->
    <rect x="100" y="140" width="28" height="240" fill="#5dade2" stroke="#2874a6"/>
    <text x="80" y="280" class="s">板</text>

    <text x="160" y="260" class="ok">地梁□80</text>
    <text x="160" y="160" class="w">圈梁□60</text>
    <text x="480" y="300" class="t">立柱□80</text>

    <text x="40" y="450" class="t">板挂在这一套架外侧/柱间</text>
    <text x="40" y="485" class="ok">就是之前整架图那一套</text>
  </g>

  <!-- RIGHT: double frame -->
  <g transform="translate(720,95)">
    <rect x="0" y="0" width="640" height="520" class="box"/>
    <text x="16" y="32" class="h">现在：两套方管框架</text>
    <text x="16" y="60" class="s">（只有 70 板，双层墙）</text>

    <!-- outer frame -->
    <rect x="80" y="100" width="420" height="320" fill="none" stroke="#f39c12" stroke-width="8"/>
    <text x="200" y="90" class="w">外框架（原来那套尺寸思路）</text>
    <!-- inner frame inset -->
    <rect x="160" y="160" width="280" height="220" fill="none" stroke="#8e44ad" stroke-width="8"/>
    <text x="220" y="280" class="ok">内框架（缩小一圈）</text>
    <!-- wool between -->
    <text x="100" y="250" class="s">岩棉</text>
    <text x="100" y="450" class="t">外70挂外架　内70挂内架</text>
    <text x="100" y="485" class="ok">型钢规格可与原来相同</text>
  </g>

  <!-- bottom mapping -->
  <rect x="40" y="650" width="1320" height="180" fill="#eaf2f8" stroke="#5dade2" stroke-width="2"/>
  <text x="60" y="690" class="h">对应关系</text>
  <text x="60" y="730" class="t">原来一套：地梁□80 + 立柱□80 + 圈梁□60 + 顶檩□60　→　现在作为「外框架」照做</text>
  <text x="60" y="765" class="t">再加一套缩进的：内地梁□80 + 内立柱□80（与外柱错开）+ 内圈梁□60　→　「内框架」</text>
  <text x="60" y="800" class="ok">你图里的外柱/内柱 = 外架立柱 / 内架立柱；不是取消方管架，而是方管架做两圈。</text>
</svg>
